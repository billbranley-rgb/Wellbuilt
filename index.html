function bindFieldModeEvents() {
  // GPS
  const gpsBtn = document.getElementById('gps-btn');
  if (gpsBtn) {
    gpsBtn.addEventListener('click', () => {
      if (!navigator.geolocation) { alert('GPS not available on this device'); return; }
      gpsBtn.textContent = '⏳ Locating...';
      gpsBtn.classList.add('searching');
      navigator.geolocation.getCurrentPosition(pos => {
        window.__fieldState.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`)
          .then(r => r.json())
          .then(d => {
            const addr = d.address || {};
            window.__fieldState.gpsLabel = [addr.road, addr.city || addr.town || addr.village, addr.state].filter(Boolean).join(', ');
            render();
          })
          .catch(() => { window.__fieldState.gpsLabel = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`; render(); });
      }, () => { alert('Could not get location. Check browser permissions.'); gpsBtn.classList.remove('searching'); });
    });
  }

  // Job selector
  const jobSel = document.getElementById('field-job-select');
  if (jobSel) {
    jobSel.addEventListener('change', e => {
      window.__fieldState.jobId = e.target.value;
      render();
    });
  }

  // Photo input
  const photoInput = document.getElementById('field-photo-input');
  if (photoInput) {
    photoInput.addEventListener('change', e => {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          window.__fieldState.photos.push({ dataUrl: ev.target.result, name: file.name, timestamp: new Date().toISOString() });
          render();
        };
        reader.readAsDataURL(file);
      });
    });
  }

  // Remove photo
  document.querySelectorAll('[data-remove-photo]').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = parseInt(e.target.dataset.removePhoto);
      window.__fieldState.photos.splice(idx, 1);
      render();
    });
  });

  // Log textarea sync
  const logTxt = document.getElementById('field-log-text');
  if (logTxt) {
    logTxt.addEventListener('input', e => { window.__fieldState.logText = e.target.value; });
  }

  // Voice dictation
  const voiceBtn = document.getElementById('voice-btn');
  if (voiceBtn) {
    voiceBtn.addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('Voice dictation not supported in this browser. Try Chrome on Android or Safari on iPhone.'); return; }
      if (window.__fieldRecognition) {
        window.__fieldRecognition.stop();
        window.__fieldRecognition = null;
        document.getElementById('voice-btn-label').textContent = 'Dictate log (voice)';
        voiceBtn.classList.remove('recording');
        return;
      }
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-US';
      window.__fieldRecognition = rec;
      voiceBtn.classList.add('recording');
      document.getElementById('voice-btn-label').textContent = '🔴 Recording — tap to stop';
      rec.onresult = ev => {
        let transcript = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          transcript += ev.results[i][0].transcript;
        }
        const logEl = document.getElementById('field-log-text');
        if (logEl) {
          const base = window.__fieldState.logText;
          logEl.value = base + (base && !base.endsWith(' ') ? ' ' : '') + transcript;
        }
      };
      rec.onend = () => {
        if (window.__fieldRecognition) {
          const logEl = document.getElementById('field-log-text');
          if (logEl) window.__fieldState.logText = logEl.value;
          window.__fieldRecognition = null;
          voiceBtn.classList.remove('recording');
          document.getElementById('voice-btn-label').textContent = 'Dictate log (voice)';
        }
      };
      rec.start();
    });
  }

  // Submit
  const submitBtn = document.getElementById('field-submit-btn');
  if (submitBtn && !submitBtn.disabled) {
    submitBtn.addEventListener('click', () => {
      const fs = window.__fieldState;
      // Sync textarea
      const logEl = document.getElementById('field-log-text');
      if (logEl) fs.logText = logEl.value;

      const proj = state.projects.find(p => p.id === fs.jobId);
      if (!proj) return;

      // Add daily log entry
      if (!proj.logs) proj.logs = [];
      const logEntry = {
        id: 'log-' + Date.now(),
        date: new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }),
        text: fs.logText || '(No notes)',
        author: state.settings?.company || 'Field',
        gps: fs.gps ? fs.gpsLabel : null,
        photos: fs.photos.map(p => p.dataUrl),
      };
      proj.logs.unshift(logEntry);

      // Add photos to project photos array
      if (!proj.photos) proj.photos = [];
      fs.photos.forEach((p, i) => {
        proj.photos.unshift({
          id: 'fp-' + Date.now() + i,
          src: p.dataUrl,
          caption: `Field photo — ${logEntry.date}`,
          stage: proj.phase || 'Field',
          date: logEntry.date,
        });
      });

      // Update progress
      proj.lastActivity = logEntry.date;

      // Mark submitted + reset
      window.__fieldState = {
        jobId: fs.jobId,
        photos: [],
        logText: '',
        gps: fs.gps,
        gpsLabel: fs.gpsLabel,
        submitted: true,
      };
      render();
    });
  }

  // Reset after success
  const resetBtn = document.getElementById('field-reset-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      window.__fieldState = { jobId: window.__fieldState.jobId, photos: [], logText: '', gps: window.__fieldState.gps, gpsLabel: window.__fieldState.gpsLabel, submitted: false };
      render();
    });
  }

  // PWA install
  const installBtn = document.getElementById('install-btn');
  if (installBtn && window.__deferredInstall) {
    installBtn.addEventListener('click', () => {
      window.__deferredInstall.prompt();
      window.__deferredInstall.userChoice.then(() => { window.__deferredInstall = null; render(); });
    });
  }
}

// ---------- TIME CLOCK ----------
function renderTimeClock() {
  if (!state.crew) state.crew = [];
  if (!state.timeclock) state.timeclock = [];
  const activeJobs = state.projects.filter(p => p.status === 'active');
  const tcJob = window.__tcJob || (activeJobs[0] ? activeJobs[0].id : '');
  window.__tcJob = tcJob;
  const selectedJob = state.projects.find(p => p.id === tcJob);

  // Who is currently clocked in
  const clockedInEntries = state.timeclock.filter(e => !e.clockOut);
  const clockedInWorkerIds = new Set(clockedInEntries.map(e => e.workerId));

  // Live workers strip
  const liveCount = clockedInEntries.length;
  const liveStrip = liveCount > 0 ? `
    <div class="tc-live-strip">
      <div class="tc-live-dot"></div>
      ${liveCount} worker${liveCount > 1 ? 's' : ''} currently on the clock
      &nbsp;··· <a href="#" data-nav="timesheets" style="color:#f97316;font-size:0.78rem;">View timesheets →</a>
    </div>` : '';

  const workerRows = state.crew.filter(w => w.active).map(w => {
    const isClockedIn = clockedInWorkerIds.has(w.id);
    const entry = clockedInEntries.find(e => e.workerId === w.id);
    const elapsed = entry ? (() => {
      const mins = Math.floor((Date.now() - entry.clockIn) / 60000);
      const h = Math.floor(mins / 60); const m = mins % 60;
      return `${h}h ${m}m`;
    })() : null;
    return `
      <div class="tc-worker-row ${isClockedIn ? 'clocked-in' : ''}">
        <div class="tc-worker-info">
          <div class="tc-worker-name">${w.name}</div>
          <div class="tc-worker-role">${w.role || 'Worker'}</div>
          ${isClockedIn
            ? `<div class="tc-worker-status">● On the clock · ${elapsed}</div>
               ${entry.gpsLabel ? `<div class="tc-gps-tag">📍 ${entry.gpsLabel}</div>` : ''}`
            : `<div class="tc-worker-status out">Clocked out</div>`}
        </div>
        <button class="tc-clock-btn ${isClockedIn ? 'out' : 'in'}" data-worker-id="${w.id}">
          ${isClockedIn ? 'Clock Out' : 'Clock In'}
        </button>
      </div>`;
  }).join('');

  return `
    <div class="tc-shell">
      <div class="tc-topbar">
        <div class="tc-topbar-title">Kunst<span>ruction</span>1 <span style="font-weight:400;font-size:0.85rem;color:#94a3b8;">· Time Clock</span></div>
        <button data-nav="timesheets" style="background:none;border:1px solid rgba(255,255,255,0.12);color:#94a3b8;border-radius:7px;padding:5px 12px;font-size:0.75rem;cursor:pointer;">Timesheets →</button>
      </div>
      <div class="tc-body">
        ${liveStrip}

        <div class="tc-card">
          <div class="tc-section-label">Active Job</div>
          <select class="tc-job-select" id="tc-job-select">
            <option value="">— Select job —</option>
            ${activeJobs.map(j => `<option value="${j.id}" ${j.id === tcJob ? 'selected' : ''}>${j.name} · ${j.client || ''}</option>`).join('')}
            ${activeJobs.length === 0 ? '<option disabled>No active jobs</option>' : ''}
          </select>
          ${selectedJob ? `<div style="font-size:0.72rem;color:#94a3b8;margin-top:6px;">${selectedJob.address || ''}</div>` : ''}
        </div>

        <div class="tc-card">
          <div class="tc-section-label">Crew</div>
          ${state.crew.filter(w=>w.active).length === 0
            ? `<div style="color:#94a3b8;font-size:0.88rem;">No crew members yet. <a href="#" data-nav="settings" style="color:#f97316;">Add in Settings →</a></div>`
            : `<div class="tc-worker-grid">${workerRows}</div>`}
        </div>

        <div style="font-size:0.75rem;color:#475569;text-align:center;">
          GPS location is captured automatically on clock-in. · <a href="#" data-nav="settings" style="color:#f97316;">Manage crew</a>
        </div>
      </div>
    </div>`;
}

function bindTimeClockEvents() {
  // Job select
  document.getElementById('tc-job-select')?.addEventListener('change', e => {
    window.__tcJob = e.target.value; render();
  });

  // Clock in / out buttons
  document.querySelectorAll('[data-worker-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wid = btn.dataset.workerId;
      const jobId = window.__tcJob;
      if (!jobId) { showToast('Select a job first'); return; }
      const existing = state.timeclock.find(e => e.workerId === wid && !e.clockOut);

      if (existing) {
        // Clock out
        existing.clockOut = Date.now();
        existing.durationMins = Math.round((existing.clockOut - existing.clockIn) / 60000);
        saveState(); render();
        const h = Math.floor(existing.durationMins / 60);
        const m = existing.durationMins % 60;
        const w = state.crew.find(x => x.id === wid);
        showToast(`${w ? w.name : 'Worker'} clocked out — ${h}h ${m}m`);
      } else {
        // Clock in — get GPS in background
        const entry = {
          id: 'tc-' + Date.now(),
          workerId: wid,
          jobId,
          clockIn: Date.now(),
          clockOut: null,
          durationMins: null,
          gps: null,
          gpsLabel: null,
          date: new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }),
        };
        state.timeclock.push(entry);
        saveState(); render();
        const w = state.crew.find(x => x.id === wid);
        showToast(`${w ? w.name : 'Worker'} clocked in`);

        // Background GPS tag
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`)
              .then(r => r.json())
              .then(d => {
                const addr = d.address || {};
                entry.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                entry.gpsLabel = [addr.road, addr.city || addr.town || addr.village, addr.state].filter(Boolean).join(', ');
                saveState(); render();
              }).catch(() => {});
          }, () => {});
        }
      }
    });
  });
}

function bindReceiptsEvents() {
  // Open modal
  document.getElementById('rec-add-btn')?.addEventListener('click', () => {
    window.__recModal = true;
    window.__recDraft = { photoUrl: null, amount: '', description: '', category: 'Materials', jobId: window.__tcJob||'', vendor: '' };
    render();
  });
  // Close modal
  document.getElementById('rec-modal-cancel')?.addEventListener('click', () => { window.__recModal = false; window.__recDraft = null; render(); });
  document.getElementById('rec-modal-overlay')?.addEventListener('click', (e) => { if (e.target.id==='rec-modal-overlay') { window.__recModal=false; window.__recDraft=null; render(); } });
  document.getElementById('rec-modal-stop')?.addEventListener('click', e => e.stopPropagation());

  // Photo capture
  document.getElementById('rec-photo-input')?.addEventListener('change', e => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { if (!window.__recDraft) window.__recDraft = {}; window.__recDraft.photoUrl = ev.target.result; render(); };
    reader.readAsDataURL(file);
  });

  // Save receipt
  document.getElementById('rec-modal-save')?.addEventListener('click', () => {
    const amount = document.getElementById('rec-amount')?.value;
    if (!amount || isNaN(parseFloat(amount))) { showToast('Enter an amount'); return; }
    const rec = {
      id: 'rec-' + Date.now(),
      amount: parseFloat(amount).toFixed(2),
      description: document.getElementById('rec-desc')?.value || '',
      category: document.getElementById('rec-cat')?.value || 'Other',
      jobId: document.getElementById('rec-job')?.value || '',
      vendor: document.getElementById('rec-vendor')?.value || '',
      photoUrl: window.__recDraft?.photoUrl || null,
      gpsLabel: window.__lastGeoLabel || null,
      date: new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }),
      createdAt: Date.now(),
    };
    if (!state.receipts) state.receipts = [];
    state.receipts.unshift(rec);

    // Also wire into project budget if job is selected
    if (rec.jobId) {
      const proj = state.projects.find(p => p.id === rec.jobId);
      if (proj) {
        if (!proj.budget) proj.budget = [];
        proj.budget.push({ id: rec.id, label: `${rec.category}: ${rec.description||rec.vendor||'Receipt'}`, actual: parseFloat(rec.amount), receipt: true });
      }
    }

    saveState();
    window.__recModal = false; window.__recDraft = null;
    showToast(`Receipt saved — $${rec.amount}`);
    render();
  });

  // Delete receipt
  document.querySelectorAll('[data-del-receipt]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.receipts = state.receipts.filter(r => r.id !== btn.dataset.delReceipt);
      saveState(); render();
    });
  });

  // Filters
  document.getElementById('rec-filter-job')?.addEventListener('change', e => { window.__recFilterJob = e.target.value; render(); });
  document.getElementById('rec-filter-cat')?.addEventListener('change', e => { window.__recFilterCat = e.target.value; render(); });

  // Export CSV
  document.getElementById('rec-export-btn')?.addEventListener('click', () => {
    if (!state.receipts || state.receipts.length === 0) { showToast('No receipts to export'); return; }
    const rows = [['Date','Amount','Description','Category','Job','Vendor','GPS Location']];
    state.receipts.forEach(r => {
      const job = state.projects.find(p=>p.id===r.jobId);
      rows.push([r.date||'', `$${r.amount}`, r.description||'', r.category||'', job?.name||'', r.vendor||'', r.gpsLabel||'']);
    });
    const csv = rows.map(r => r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='kunstruction1-receipts.csv'; a.click();
    URL.revokeObjectURL(url); showToast('Receipts exported');
  });
}

// ---------- 2-WEEK LOOK AHEAD ----------
function renderLookahead() {
  if (!state.lookahead) state.lookahead = [];
  const today = new Date(); today.setHours(0,0,0,0);
  const activeTab = window.__laTab || 'lookahead'; // 'lookahead' | 'ballincourt'
  const filterProj = window.__laFilterProj || '';
  const filterAssignee = window.__laFilterAssignee || '';

  // Build 14-day strip
  const days = [];
  for (let i = -1; i < 14; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    days.push(d);
  }

  // Tasks within next 14 days (include 1 day back for overdue context)
  const windowStart = new Date(today); windowStart.setDate(today.getDate() - 1);
  const windowEnd = new Date(today); windowEnd.setDate(today.getDate() + 14);

  let tasks = state.lookahead.filter(t => {
    const d = new Date(t.dueDate);
    return d >= windowStart && d <= windowEnd;
  });
  if (filterProj) tasks = tasks.filter(t => t.projectId === filterProj);
  if (filterAssignee) tasks = tasks.filter(t => t.assignedTo === filterAssignee);

  const overdueCount = state.lookahead.filter(t => {
    const d = new Date(t.dueDate); return d < today && t.status !== 'done';
  }).length;

  // Day strip
  const stripHtml = days.map(d => {
    const iso = d.toISOString().slice(0,10);
    const dayTasks = state.lookahead.filter(t => t.dueDate === iso);
    const hasOverdue = dayTasks.some(t => new Date(t.dueDate) < today && t.status !== 'done');
    const isToday = d.toDateString() === today.toDateString();
    const dots = dayTasks.slice(0,3).map(t => `<div class="la-dot${hasOverdue?' overdue':''}"></div>`).join('');
    return `<div class="la-day-pill${isToday?' today':''}${hasOverdue?' has-overdue':''}" data-la-day="${iso}">
      <div class="la-dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
      <div class="la-date">${d.getDate()}</div>
      <div class="la-dot-row">${dots}</div>
    </div>`;
  }).join('');

  // Task rows renderer
  function taskRow(t) {
    const proj = state.projects.find(p => p.id === t.projectId);
    const dDate = new Date(t.dueDate);
    const isOverdue = dDate < today && t.status !== 'done';
    const isDone = t.status === 'done';
    const dateLabel = dDate.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return `<div class="la-task-row${isOverdue?' overdue':''}${isDone?' done':''}" data-la-task="${t.id}">
      <div class="la-checkbox${isDone?' checked':''}" data-la-check="${t.id}">${isDone?`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" style="width:11px;height:11px"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>
      <div class="la-task-body">
        <div class="la-task-title">${t.title}</div>
        <div class="la-task-meta">
          ${proj ? `<span>${proj.name}</span>` : ''}
          ${t.note ? `<span class="muted">${t.note}</span>` : ''}
        </div>
      </div>
      <div class="la-task-right">
        <span class="bic-chip bic-${t.assignedTo}">${t.assignedTo}</span>
        <span class="bic-chip pri-${t.priority}">${t.priority}</span>
        <span style="font-size:11px;color:var(--text-muted)">${isOverdue?'⚠ ':''}${dateLabel}</span>
      </div>
    </div>`;
  }

  // Group tasks by day for Look Ahead tab
  let lookAheadHtml = '';
  const grouped = {};
  tasks.forEach(t => {
    const k = t.dueDate; if (!grouped[k]) grouped[k] = [];
    grouped[k].push(t);
  });
  const sortedKeys = Object.keys(grouped).sort();
  if (sortedKeys.length === 0) {
    lookAheadHtml = `<div class="la-empty">${ico('schedule')} No tasks in this window.<br><br>Tap <strong>+ Add Task</strong> to get started.</div>`;
  } else {
    sortedKeys.forEach(k => {
      const d = new Date(k);
      const isToday = d.toDateString() === today.toDateString();
      const isPast = d < today;
      const label = isToday ? 'Today' : isPast ? `⚠ Overdue · ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}` : d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
      lookAheadHtml += `<div class="la-section"><div class="la-section-title">${label}</div>${grouped[k].map(taskRow).join('')}</div>`;
    });
  }

  // Ball in Court tab — group by assignee
  const bicAssignees = ['Contractor','Client','Sub','Inspector','Supplier','Other'];
  const bicColors = { Contractor:'#3b82f6', Client:'#a855f7', Sub:'#f97316', Inspector:'#ca8a04', Supplier:'#14b8a6', Other:'#6b7280' };
  let bicHtml = '';
  const openTasks = state.lookahead.filter(t => t.status !== 'done');
  bicAssignees.forEach(role => {
    const roleTasks = openTasks.filter(t => t.assignedTo === role);
    if (!roleTasks.length) return;
    bicHtml += `<div class="bic-section">
      <h4 style="color:${bicColors[role]}">${ico('flag')} Ball in Court — ${role}</h4>
      ${roleTasks.map(t => {
        const proj = state.projects.find(p => p.id === t.projectId);
        const dDate = new Date(t.dueDate);
        const isOverdue = dDate < today;
        const initials = t.assignedName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        return `<div class="bic-row">
          <div class="bic-avatar" style="background:${bicColors[role]}">${initials}</div>
          <div class="bic-info">
            <div class="bic-name">${t.assignedName}</div>
            <div class="bic-task">${t.title}${proj?' · '+proj.name:''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <span class="bic-chip pri-${t.priority}">${t.priority}</span>
            <span style="font-size:11px;color:${isOverdue?'#ef4444':'var(--text-muted)'}">${isOverdue?'⚠ OVERDUE · ':''}
              ${dDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  if (!bicHtml) bicHtml = `<div class="la-empty">No open items. All clear!</div>`;

  // Filters
  const projOptions = state.projects.map(p => `<option value="${p.id}"${filterProj===p.id?' selected':''}>${p.name}</option>`).join('');
  const assigneeOptions = ['Contractor','Client','Sub','Inspector','Supplier','Other'].map(a=>`<option value="${a}"${filterAssignee===a?' selected':''}>${a}</option>`).join('');

  // Add task modal
  const modal = window.__laModal ? `
    <div class="la-modal-overlay" id="la-modal-overlay">
      <div class="la-modal" id="la-modal-stop">
        <h3>${ico('schedule')} Add Task</h3>
        <div class="form-group"><label>Task / Action Item</label><input class="form-input" id="la-title" placeholder="e.g. Client approve tile selection" value="${window.__laDraft?.title||''}"></div>
        <div class="form-group"><label>Due Date</label><input class="form-input" type="date" id="la-due" value="${window.__laDraft?.dueDate||new Date().toISOString().slice(0,10)}"></div>
        <div class="form-row">
          <div class="form-group" style="flex:1"><label>Ball in Court</label><select class="form-select" id="la-assignee"><option value="Contractor">Contractor (Me)</option><option value="Client">Client</option><option value="Sub">Sub</option><option value="Inspector">Inspector</option><option value="Supplier">Supplier</option><option value="Other">Other</option></select></div>
          <div class="form-group" style="flex:1"><label>Priority</label><select class="form-select" id="la-priority"><option value="Normal">Normal</option><option value="Critical">Critical</option><option value="FYI">FYI</option></select></div>
        </div>
        <div class="form-group"><label>Assigned To (name)</label><input class="form-input" id="la-assignedname" placeholder="e.g. Cohen Family" value="${window.__laDraft?.assignedName||''}"></div>
        <div class="form-group"><label>Project</label><select class="form-select" id="la-proj"><option value="">— No project —</option>${state.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div class="form-group"><label>Note (optional)</label><input class="form-input" id="la-note" placeholder="Any details…" value="${window.__laDraft?.note||''}"></div>
        <div class="rec-modal-actions">
          <button class="btn btn-primary" id="la-save-btn">Save Task</button>
          <button class="rec-modal-cancel" id="la-modal-cancel">Cancel</button>
        </div>
      </div>
    </div>` : '';

  return `
    <div class="la-shell">
      <div class="page-head">
        <div>
          <h2>2-Week Look Ahead</h2>
          <div class="sub">${overdueCount > 0 ? `<span style="color:#ef4444;font-weight:700">⚠ ${overdueCount} overdue item${overdueCount>1?'s':''}</span> · ` : ''}${state.lookahead.filter(t=>t.status!=='done').length} open items</div>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-primary" id="la-add-btn">${ico('plus')} Add Task</button>
        </div>
      </div>

      <div class="la-strip">${stripHtml}</div>

      <div class="la-tabs">
        <button class="la-tab${activeTab==='lookahead'?' active':''}" data-la-tab="lookahead">${ico('schedule')} Timeline</button>
        <button class="la-tab${activeTab==='ballincourt'?' active':''}" data-la-tab="ballincourt">${ico('flag')} Ball in Court</button>
      </div>

      <div class="la-filters">
        <select class="la-filter-sel" id="la-filter-proj"><option value="">All projects</option>${projOptions}</select>
        <select class="la-filter-sel" id="la-filter-assignee"><option value="">All assignees</option>${assigneeOptions}</select>
      </div>

      ${activeTab === 'lookahead' ? lookAheadHtml : bicHtml}

      <button class="wc-export-btn" id="la-csv-btn">↓ Export CSV</button>
    </div>
    ${modal}`;
}

function bindLookaheadEvents() {
  // Tabs
  document.querySelectorAll('[data-la-tab]').forEach(btn => {
    btn.onclick = () => { window.__laTab = btn.dataset.laTab; render(); };
  });
  // Filters
  document.getElementById('la-filter-proj')?.addEventListener('change', e => { window.__laFilterProj = e.target.value; render(); });
  document.getElementById('la-filter-assignee')?.addEventListener('change', e => { window.__laFilterAssignee = e.target.value; render(); });
  // Add button
  document.getElementById('la-add-btn')?.addEventListener('click', () => {
    window.__laModal = true; window.__laDraft = {}; render();
  });
  // Modal cancel
  document.getElementById('la-modal-cancel')?.addEventListener('click', () => { window.__laModal=false; window.__laDraft=null; render(); });
  document.getElementById('la-modal-overlay')?.addEventListener('click', e => { if(e.target.id==='la-modal-overlay'){window.__laModal=false;window.__laDraft=null;render();} });
  document.getElementById('la-modal-stop')?.addEventListener('click', e => e.stopPropagation());
  // Save task
  document.getElementById('la-save-btn')?.addEventListener('click', () => {
    const title = document.getElementById('la-title')?.value.trim();
    const dueDate = document.getElementById('la-due')?.value;
    const assignedTo = document.getElementById('la-assignee')?.value || 'Contractor';
    const priority = document.getElementById('la-priority')?.value || 'Normal';
    const assignedName = document.getElementById('la-assignedname')?.value.trim() || assignedTo;
    const projectId = document.getElementById('la-proj')?.value || '';
    const note = document.getElementById('la-note')?.value.trim() || '';
    if (!title || !dueDate) { showToast('Title and due date required'); return; }
    if (!state.lookahead) state.lookahead = [];
    state.lookahead.push({ id:'la'+Date.now(), title, dueDate, projectId, assignedTo, assignedName, priority, status:'pending', note });
    saveState(); window.__laModal=false; window.__laDraft=null; render(); showToast('Task added');
  });
  // Check/uncheck tasks
  document.querySelectorAll('[data-la-check]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const t = state.lookahead.find(x => x.id === el.dataset.laCheck);
      if (t) { t.status = t.status==='done'?'pending':'done'; saveState(); render(); }
    };
  });
  // CSV export
  document.getElementById('la-csv-btn')?.addEventListener('click', () => {
    const rows = [['Title','Due Date','Project','Assigned To','Assigned Name','Priority','Status','Note']];
    state.lookahead.forEach(t => {
      const proj = state.projects.find(p=>p.id===t.projectId);
      rows.push([t.title,t.dueDate,proj?.name||'',t.assignedTo,t.assignedName,t.priority,t.status,t.note||'']);
    });
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='kunstruction1-lookahead.csv'; a.click();
    URL.revokeObjectURL(url); showToast('Exported');
  });
}

// ---------- WEEKLY COST SUMMARY ----------
const LABOR_RATE = 75; // $/hr — in-house crew flat rate

function renderWeeklyCost() {
  if (!state.timeclock) state.timeclock = [];
  if (!state.receipts) state.receipts = [];
  if (!state.crew) state.crew = [];

  // Week offset navigation
  const weekOffset = window.__wcWeekOffset || 0;
  const today = new Date(); today.setHours(0,0,0,0);
  // Get Monday of current week, then apply offset
  const dayOfWeek = today.getDay() === 0 ? 6 : today.getDay() - 1; // Mon=0
  const monday = new Date(today); monday.setDate(today.getDate() - dayOfWeek + weekOffset * 7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);

  const weekLabel = monday.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' – ' + sunday.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  function inWeek(dateStr) {
    const d = new Date(dateStr); d.setHours(0,0,0,0);
    return d >= monday && d <= sunday;
  }

  // Seed 169-hr example if not present
  if (!state.timeclock.find(e => e.id === 'tc-manual-169-example')) {
    const exDate = new Date(monday); // put it in the current week being viewed
    state.timeclock.push({
      id: 'tc-manual-169-example',
      workerId: '__manual__',
      manualWorkerName: 'Willow Rd Crew',
      jobId: 'p1',
      clockIn: null,
      clockOut: null,
      durationMins: null,
      manualHours: 169,
      manualDate: exDate.toISOString().slice(0,10),
      manualDesc: 'Full project labor — bath remodel',
      date: exDate.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
      gps: null, gpsLabel: null,
    });
    saveState();
  }

  // --- Labor: timeclock entries in this week (clock-ins + manual) ---
  const laborEntries = state.timeclock.filter(e => {
    // Manual entries: match by manualDate
    if (e.manualHours != null) {
      return e.manualDate && inWeek(e.manualDate);
    }
    const d = e.clockIn ? new Date(e.clockIn) : null;
    if (!d) return false;
    d.setHours(0,0,0,0);
    return d >= monday && d <= sunday && e.durationMins != null;
  });

  // --- Materials: receipts in this week ---
  const matReceipts = state.receipts.filter(r => r.date && inWeek(r.date));

  // Group by project
  const projIds = new Set([
    ...laborEntries.map(e => e.jobId),
    ...matReceipts.map(r => r.jobId),
  ]);

  let totalLaborHrs = 0, totalLaborCost = 0, totalMatCost = 0;

  const projCards = [...projIds].map(pid => {
    const proj = state.projects.find(p => p.id === pid);
    const projName = proj?.name || 'Unassigned';
    const projClient = proj?.client || '';

    // Labor lines for this project
    const projLabor = laborEntries.filter(e => e.jobId === pid);
    const laborHrs = projLabor.reduce((s,e) => s + (e.durationMins||0)/60, 0);
    const laborCost = laborHrs * LABOR_RATE;
    totalLaborHrs += laborHrs; totalLaborCost += laborCost;

    // Material lines for this project
    const projMats = matReceipts.filter(r => r.jobId === pid);
    const matCost = projMats.reduce((s,r) => s + parseFloat(r.amount||0), 0);
    totalMatCost += matCost;

    const projTotal = laborCost + matCost;

    // Labor rows
    const laborRows = projLabor.map(e => {
      const worker = state.crew.find(w => w.id === e.workerId);
      const hrs = e.manualHours != null ? e.manualHours : (e.durationMins||0)/60;
      const cost = hrs * LABOR_RATE;
      const isManual = !!e.manualHours;
      const workerName = isManual ? (e.manualWorkerName || worker?.name || 'Worker') : (worker?.name || 'Worker');
      const dateStr = isManual ? (e.manualDate || e.date || '—') : (e.clockIn ? new Date(e.clockIn).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '—');
      const desc = e.manualDesc || '';
      return `<tr>
        <td>${workerName} <span class="${isManual?'wc-manual-tag':'wc-labor-tag'}">${isManual?'Manual':'Labor'}</span>${desc?` <span style="color:var(--text-muted);font-size:11.5px">· ${desc}</span>`:''}</td>
        <td>${dateStr}</td>
        <td>${hrs.toFixed(1)} hrs @ $${LABOR_RATE}/hr</td>
        <td>${fmtUsd(cost)}</td>
      </tr>`;
    }).join('');

    // Material rows
    const matRows = projMats.map(r => {
      return `<tr>
        <td>${r.description || r.category || 'Material'} <span class="wc-mat-tag">${r.category||'Mat'}</span></td>
        <td>${r.date || '—'}</td>
        <td>${r.vendor || 'Vendor'}</td>
        <td>${fmtUsd(parseFloat(r.amount||0))}</td>
      </tr>`;
    }).join('');

    const laborSubRow = projLabor.length ? `<tr class="wc-subtotal-row"><td colspan="3">Labor subtotal · ${laborHrs.toFixed(1)} hrs</td><td>${fmtUsd(laborCost)}</td></tr>` : '';
    const matSubRow = projMats.length ? `<tr class="wc-subtotal-row"><td colspan="3">Materials subtotal</td><td>${fmtUsd(matCost)}</td></tr>` : '';

    return `
      <div class="wc-proj-card">
        <div class="wc-proj-head">
          <div>
            <div class="wc-proj-name">${projName}</div>
            <div class="wc-proj-sub">${projClient}</div>
          </div>
          <div class="wc-proj-total">${fmtUsd(projTotal)}</div>
        </div>
        <table class="wc-line-table">
          <thead><tr><th>Description</th><th>Date</th><th>Detail</th><th>Amount</th></tr></thead>
          <tbody>
            ${projLabor.length ? `<tr><td colspan="4" class="wc-section-sub">Labor</td></tr>${laborRows}${laborSubRow}` : ''}
            ${projMats.length ? `<tr><td colspan="4" class="wc-section-sub">Materials</td></tr>${matRows}${matSubRow}` : ''}
          </tbody>
        </table>
      </div>`;
  });

  const grandTotal = totalLaborCost + totalMatCost;

  const emptyState = projCards.length === 0 ? `<div class="wc-empty">${ico('dollar')} No labor or material entries for this week.<br><br>Clock in workers and add receipts to see costs here.</div>` : '';

  return `
    <div class="wc-shell">
      <div class="page-head">
        <div>
          <h2>Weekly Costs</h2>
          <div class="sub">Labor · Materials · Billable summary</div>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-primary" id="wc-add-hours-btn">${ico('plus')} Add Manual Hours</button>
          <button class="wc-export-btn" id="wc-export-btn">↓ Export CSV</button>
        </div>
      </div>

      <div class="wc-week-nav">
        <button class="wc-nav-btn" id="wc-prev">‹</button>
        <div class="wc-week-label">${weekLabel}</div>
        <button class="wc-nav-btn" id="wc-next" ${weekOffset>=0?'disabled style="opacity:0.35;cursor:not-allowed"':''}>›</button>
      </div>

      <div class="wc-rate-note">${ico('dollar')} In-house labor billed at <strong style="color:var(--text);margin:0 3px">$${LABOR_RATE}/hr</strong> flat rate across all crew members.</div>

      <div class="wc-summary-grid">
        <div class="wc-kpi"><div class="label">Labor Hours</div><div class="value">${totalLaborHrs.toFixed(1)}</div><div class="sub">${laborEntries.length} clock-in entries</div></div>
        <div class="wc-kpi"><div class="label">Labor Cost</div><div class="value">${fmtUsd(totalLaborCost)}</div><div class="sub">@ $${LABOR_RATE}/hr in-house</div></div>
        <div class="wc-kpi"><div class="label">Materials</div><div class="value">${fmtUsd(totalMatCost)}</div><div class="sub">${matReceipts.length} receipt(s)</div></div>
        <div class="wc-kpi accent"><div class="label">Total Billable</div><div class="value">${fmtUsd(grandTotal)}</div><div class="sub">This week</div></div>
      </div>

      ${projCards.join('') || emptyState}

      ${window.__wcModal ? `
        <div class="wc-modal-overlay" id="wc-modal-overlay">
          <div class="wc-modal" id="wc-modal-stop">
            <h3>${ico('clock')} Add Manual Hours</h3>
            <div class="form-group">
              <label>Worker</label>
              <select class="form-select" id="wc-m-worker">
                <option value="__manual__">Manual / Other</option>
                ${(state.crew||[]).map(w=>`<option value="${w.id}" ${window.__wcDraft?.workerId===w.id?'selected':''}>${w.name} — ${w.role}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Worker Name (if manual)</label>
              <input class="form-input" id="wc-m-name" placeholder="e.g. John Smith" value="${window.__wcDraft?.workerName||''}">
            </div>
            <div class="form-group">
              <label>Project / Job</label>
              <select class="form-select" id="wc-m-job">
                <option value="">— Select project —</option>
                ${state.projects.map(p=>`<option value="${p.id}" ${window.__wcDraft?.jobId===p.id?'selected':''}>${p.name} · ${p.client||''}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Hours</label>
                <input class="form-input" type="number" id="wc-m-hours" min="0.5" step="0.5" placeholder="e.g. 8" value="${window.__wcDraft?.hours||''}">
              </div>
              <div class="form-group">
                <label>Date</label>
                <input class="form-input" type="date" id="wc-m-date" value="${window.__wcDraft?.date||new Date().toISOString().slice(0,10)}">
              </div>
            </div>
            <div class="form-group">
              <label>Description / Note</label>
              <input class="form-input" id="wc-m-desc" placeholder="e.g. Framing labor, demo, punch list…" value="${window.__wcDraft?.desc||''}">
            </div>
            <div class="rec-modal-actions">
              <button class="btn btn-primary" id="wc-m-save">Save Hours</button>
              <button class="rec-modal-cancel" id="wc-m-cancel">Cancel</button>
            </div>
          </div>
        </div>` : ''}
    </div>`;
}

function renderTimesheets() {
  if (!state.crew) state.crew = [];
  if (!state.timeclock) state.timeclock = [];

  const filterWorker = window.__tsFilterWorker || '';
  const filterJob = window.__tsFilterJob || '';

  // Build entries enriched with worker + job names
  let entries = state.timeclock.map(e => ({
    ...e,
    workerName: state.crew.find(w => w.id === e.workerId)?.name || 'Unknown',
    workerRole: state.crew.find(w => w.id === e.workerId)?.role || '',
    jobName: state.projects.find(p => p.id === e.jobId)?.name || 'Unknown Job',
    hoursDecimal: e.durationMins ? (e.durationMins / 60) : null,
  }));

  if (filterWorker) entries = entries.filter(e => e.workerId === filterWorker);
  if (filterJob) entries = entries.filter(e => e.jobId === filterJob);

  // Sort newest first
  entries.sort((a,b) => b.clockIn - a.clockIn);

  // Summary stats
  const completedEntries = entries.filter(e => e.durationMins != null);
  const totalHours = completedEntries.reduce((s,e) => s + e.hoursDecimal, 0);
  const activeCount = entries.filter(e => !e.clockOut).length;
  const workerCount = new Set(entries.map(e => e.workerId)).size;

  function fmtDuration(mins) {
    if (mins == null) return '—';
    return `${Math.floor(mins/60)}h ${mins%60}m`;
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  }

  const rows = entries.length === 0
    ? `<tr><td colspan="7" style="text-align:center;color:#475569;padding:24px;">No time entries yet. Use Time Clock to log hours.</td></tr>`
    : entries.map(e => `
        <tr>
          <td style="font-weight:600;">${e.workerName}<br><span style="font-size:0.72rem;color:#94a3b8;">${e.workerRole}</span></td>
          <td>${e.jobName}</td>
          <td>${e.date}</td>
          <td>${fmtTime(e.clockIn)}</td>
          <td>${e.clockOut ? fmtTime(e.clockOut) : '<span class="ts-badge active">● Live</span>'}</td>
          <td style="font-weight:700;color:${e.clockOut ? '#f97316' : '#22c55e'}">${e.clockOut ? fmtDuration(e.durationMins) : 'In progress'}</td>
          <td style="font-size:0.72rem;color:#94a3b8;">${e.gpsLabel || '—'}</td>
        </tr>`).join('');

  return `
    <div class="ts-shell">
      <div class="ts-header">
        <h2>Timesheets</h2>
        <button class="ts-export-btn" id="ts-export-btn">↓ Export CSV</button>
      </div>

      <div class="ts-summary">
        <div class="ts-sum-card">
          <div class="ts-sum-label">Total Hours</div>
          <div class="ts-sum-val">${totalHours.toFixed(1)}</div>
          <div class="ts-sum-sub">${completedEntries.length} completed entries</div>
        </div>
        <div class="ts-sum-card">
          <div class="ts-sum-label">On the Clock</div>
          <div class="ts-sum-val" style="color:#22c55e;">${activeCount}</div>
          <div class="ts-sum-sub">workers right now</div>
        </div>
        <div class="ts-sum-card">
          <div class="ts-sum-label">Workers Logged</div>
          <div class="ts-sum-val">${workerCount}</div>
          <div class="ts-sum-sub">unique workers</div>
        </div>
      </div>

      <div class="ts-filter-row">
        <select class="ts-filter-select" id="ts-filter-worker">
          <option value="">All Workers</option>
          ${state.crew.map(w => `<option value="${w.id}" ${w.id === filterWorker ? 'selected' : ''}>${w.name}</option>`).join('')}
        </select>
        <select class="ts-filter-select" id="ts-filter-job">
          <option value="">All Jobs</option>
          ${state.projects.map(p => `<option value="${p.id}" ${p.id === filterJob ? 'selected' : ''}>${p.name}</option>`).join('')}
        </select>
        <button class="ts-export-btn" data-nav="timeclock" style="margin-left:auto;">+ Clock In/Out</button>
      </div>

      <div style="overflow-x:auto;">
        <table class="ts-table">
          <thead><tr>
            <th>Worker</th><th>Job</th><th>Date</th><th>Clock In</th><th>Clock Out</th><th>Duration</th><th>Location</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function bindTimesheetsEvents() {
  document.getElementById('ts-filter-worker')?.addEventListener('change', e => { window.__tsFilterWorker = e.target.value; render(); });
  document.getElementById('ts-filter-job')?.addEventListener('change', e => { window.__tsFilterJob = e.target.value; render(); });

  document.getElementById('ts-export-btn')?.addEventListener('click', () => {
    if (!state.timeclock || state.timeclock.length === 0) { showToast('No entries to export yet'); return; }
    const rows = [['Worker','Role','Job','Date','Clock In','Clock Out','Duration (hrs)','Duration (h:m)','GPS Location']];
    state.timeclock.forEach(e => {
      const w = state.crew.find(x => x.id === e.workerId);
      const j = state.projects.find(p => p.id === e.jobId);
      const dur = e.durationMins != null ? (e.durationMins / 60).toFixed(2) : '';
      const durFmt = e.durationMins != null ? `${Math.floor(e.durationMins/60)}h ${e.durationMins%60}m` : 'In progress';
      const fmtT = ts => ts ? new Date(ts).toLocaleString('en-US') : '';
      rows.push([
        w?.name || 'Unknown', w?.role || '',
        j?.name || 'Unknown', e.date || '',
        fmtT(e.clockIn), fmtT(e.clockOut), dur, durFmt, e.gpsLabel || ''
      ]);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kunstruction1-timesheets.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('Timesheet exported');
  });
}

// Depreciation rate by condition
const XA_DEPR = { Excellent:0.05, Good:0.10, Average:0.15, Fair:0.25, Poor:0.35 };

// Overhead & profit
const XA_OHP = 0.18;

function xaCalcLine(line, stateMult, condition) {
  const qty = parseFloat(line.qty) || 0;
  const laborUnit = parseFloat(line.laborUnit) || 0;
  const matUnit = parseFloat(line.matUnit) || 0;
  const labor = qty * laborUnit * stateMult;
  const mat = qty * matUnit;
  const rcv = labor + mat;
  const deprRate = XA_DEPR[condition] || 0.15;
  const depr = mat * deprRate;   // depreciation applies to materials only
  const acv = rcv - depr;
  return { labor, mat, rcv, depr, acv };
}

function xaRoomTotal(room, stateMult) {
  const cond = state.xaMeta.condition || 'Average';
  return room.lines.reduce((s, l) => {
    const c = xaCalcLine(l, stateMult, cond);
    return s + c.rcv;
  }, 0);
}

function xaGrandTotal() {
  if (!state.xaRooms || !state.xaRooms.length) return 0;
  const sm = stateInfo(state.xaMeta.state).laborRate;
  const base = state.xaRooms.reduce((s, r) => s + xaRoomTotal(r, sm), 0);
  return base * (1 + XA_OHP);
}

function xaTradeSummary() {
  const sm = stateInfo(state.xaMeta.state).laborRate;
  const cond = state.xaMeta.condition || 'Average';
  const trades = {};
  (state.xaRooms || []).forEach(room => {
    room.lines.forEach(l => {
      const trade = l.trade || 'Other';
      if (!trades[trade]) trades[trade] = { rcv:0, labor:0, mat:0, depr:0, acv:0 };
      const c = xaCalcLine(l, sm, cond);
      trades[trade].rcv += c.rcv;
      trades[trade].labor += c.labor;
      trades[trade].mat += c.mat;
      trades[trade].depr += c.depr;
      trades[trade].acv += c.acv;
    });
  });
  return trades;
}

                        <td>${l.unit}</td>
                        <td><input class="input" style="width:60px;padding:4px 6px;font-size:12px;" data-xa-qty data-room="${room.id}" data-li="${li}" value="${l.qty||1}"></td>
                        <td>${fmtUsdExact(l.laborUnit)}</td>
                        <td>${fmtUsdExact(l.matUnit)}</td>
                        <td>${fmtUsd(c.labor)}</td>
                        <td>${fmtUsd(c.mat)}</td>
                        <td><strong>${fmtUsd(c.rcv)}</strong></td>
                        <td style="color:var(--text-muted)">${fmtUsd(c.depr)}</td>
                        <td>${fmtUsd(c.acv)}</td>
                        <td><button class="btn btn-ghost" style="font-size:10px;padding:2px 8px;" data-xa-del-line data-room="${room.id}" data-li="${li}">✕</button></td>
                      </tr>`;
                    }).join('')}
                  </tbody>
                </table>
                </div>`}
                <div style="padding:8px 16px;">
                  <button class="btn btn-ghost" style="font-size:12px;" data-xa-add-line data-room="${room.id}">+ Add custom line item</button>
                </div>
              </div>
            </div>` : ''}
          </div>`;
        }).join('')
      }
    `;
  };

  // ---------- LEVEL 4: LINE ITEMS (Full Xactimate view) ----------
  const renderL4 = () => {
    const sm4 = stateInfo(meta.state).laborRate;
    const cond = meta.condition || 'Average';
    const deprRate = XA_DEPR[cond] || 0.15;
    let allLines = [];
    state.xaRooms.forEach(room => {
      room.lines.forEach(l => {
        const c = xaCalcLine(l, sm4, cond);
        allLines.push({ ...l, roomName: room.name, ...c });
      });
    });
    if (!allLines.length) return `
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
        <div style="font-size:32px;margin-bottom:8px;">📄</div>
        <div style="font-weight:700;margin-bottom:4px;">No line items yet</div>
        <div style="font-size:13px;">Add rooms &amp; scope in Level 3 to generate your Xactimate-style breakdown.</div>
      </div>`;
    const totL = allLines.reduce((s,l)=>s+l.labor,0);
    const totM = allLines.reduce((s,l)=>s+l.mat,0);
    const totR = allLines.reduce((s,l)=>s+l.rcv,0);
    const totD = allLines.reduce((s,l)=>s+l.depr,0);
    const totA = allLines.reduce((s,l)=>s+l.acv,0);
    return `
      <div style="overflow-x:auto;">
      <table class="xa-line-table">
        <thead><tr>
          <th>Room</th><th>Code</th><th style="min-width:200px;">Description</th><th>Unit</th><th>Qty</th>
          <th>Labor/U</th><th>Mat/U</th><th>Labor $</th><th>Material $</th>
          <th>RCV</th><th>Depreciation</th><th>ACV</th>
        </tr></thead>
        <tbody>
          ${allLines.map(l=>`<tr>
            <td style="font-size:11px;color:var(--text-muted);white-space:nowrap;">${l.roomName}</td>
            <td style="font-size:10px;color:var(--text-muted);">${l.code}</td>
            <td>${l.desc}</td>
            <td>${l.unit}</td>
            <td>${l.qty||1}</td>
            <td>${fmtUsdExact(l.laborUnit)}</td>
            <td>${fmtUsdExact(l.matUnit)}</td>
            <td>${fmtUsd(l.labor)}</td>
            <td>${fmtUsd(l.mat)}</td>
            <td><strong>${fmtUsd(l.rcv)}</strong></td>
            <td style="color:var(--text-muted)">${fmtUsd(l.depr)}</td>
            <td>${fmtUsd(l.acv)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="7">Subtotal — Base Cost</td>
            <td>${fmtUsd(totL)}</td>
            <td>${fmtUsd(totM)}</td>
            <td>${fmtUsd(totR)}</td>
            <td>${fmtUsd(totD)}</td>
            <td>${fmtUsd(totA)}</td>
          </tr>
          <tr class="total-row">
            <td colspan="9">Overhead &amp; Profit (${Math.round(XA_OHP*100)}%)</td>
            <td>${fmtUsd(ohpAmt)}</td>
            <td></td>
            <td>${fmtUsd(totA * XA_OHP)}</td>
          </tr>
          <tr class="total-row" style="font-size:15px;color:var(--accent);">
            <td colspan="9">GRAND TOTAL (RCV with OH&amp;P)</td>
            <td>${fmtUsd(grand)}</td>
            <td></td>
            <td>${fmtUsd(totA + totA * XA_OHP)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
      <!-- Footer summary -->
      <div class="xa-summary-footer">
        <h3>Estimate Summary — ${meta.projectType||'Project'}</h3>
        <div class="xa-summary-line"><span>Property</span><span>${meta.address||'—'}</span></div>
        <div class="xa-summary-line"><span>State / Market</span><span>${stateInfo(meta.state).name} (labor ×${stateInfo(meta.state).laborRate.toFixed(2)})</span></div>
        <div class="xa-summary-line"><span>Condition</span><span>${cond} — ${Math.round(deprRate*100)}% material depreciation</span></div>
        <div class="xa-summary-line"><span>Finish Tier</span><span>${TIERS[meta.tier]?.name||meta.tier}</span></div>
        <div class="xa-summary-line"><span>Rooms Estimated</span><span>${state.xaRooms.length}</span></div>
        <div class="xa-summary-line"><span>Total Line Items</span><span>${allLines.length}</span></div>
        <div class="xa-summary-line"><span>Base Labor</span><span>${fmtUsd(totL)}</span></div>
        <div class="xa-summary-line"><span>Base Material</span><span>${fmtUsd(totM)}</span></div>
        <div class="xa-summary-line"><span>Overhead &amp; Profit (${Math.round(XA_OHP*100)}%)</span><span>${fmtUsd(ohpAmt)}</span></div>
        <div class="xa-summary-line total"><span>Grand Total — RCV</span><span>${fmtUsd(grand)}</span></div>
        ${sqft>0 ? `<div class="xa-summary-line"><span>Cost per SF</span><span>${fmtUsd(costPerSqft)}/SF</span></div>` : ''}
        <div style="margin-top:14px;font-size:11px;color:var(--text-muted);line-height:1.5;">
          Prepared by ${state.settings.company} · ${state.settings.owner} · ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}<br>
          NE regional rates based on RSMeans / Xactimate 2024 data. Labor market adjustments applied per state. All quantities are estimates; field verification required before contract execution.
        </div>
      </div>
    `;
  };

  // Which level to render
  let levelContent = '';
  if (level === 1) levelContent = renderL1();
  else if (level === 2) levelContent = renderL2();
  else if (level === 3) levelContent = renderL3();
  else if (level === 4) levelContent = renderL4();

  return `
    <div class="xa-shell">
      <div class="page-head">
        <div>
          <h2>Room-by-Room Estimator</h2>
          <div class="sub">Xactimate-style · NE regional pricing · RCV / ACV / Depreciation</div>
        </div>
      </div>
      ${levelTabs}
      ${levelContent}
    </div>
  `;
}

function bindXactimateEvents() {
  // Level tab buttons
  document.querySelectorAll('[data-xa-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.xaMeta.activeLevel = parseInt(btn.dataset.xaLevel);
      saveState(); render();
    });
  });

  // Meta form fields
  ['projectId','projectType','address','state','sqft','stories','yearBuilt','construction','condition','tier'].forEach(field => {
    const el = document.getElementById('xa-meta-' + field);
    if (!el) return;
    el.addEventListener('change', () => {
      state.xaMeta[field] = el.value;
      // if linked to a project, auto-fill address/state/sqft from project
      if (field === 'projectId' && el.value) {
        const p = state.projects.find(x => x.id === el.value);
        if (p) {
          state.xaMeta.address = p.address || state.xaMeta.address;
          state.xaMeta.state = p.state || state.xaMeta.state;
          // NEVER overwrite sqft if user has entered a value
          if (!state.xaMeta.sqft) state.xaMeta.sqft = String(p.sqft || '');
          state.xaMeta.projectType = p.projectType || state.xaMeta.projectType;
          state.xaMeta.tier = p.tier || state.xaMeta.tier;
        }
      }
      saveState(); render();
    });
    if (el.tagName === 'INPUT') {
      el.addEventListener('input', () => {
        state.xaMeta[field] = el.value;
        saveState();
        // re-render KPIs without full re-render for responsiveness
        if (field !== 'sqft') return;
        // re-render to update cost/sf KPI
        render();
      });
    }
  });

  // Add room button
  const addRoomBtn = document.getElementById('xa-add-room-btn');
  if (addRoomBtn) {
    addRoomBtn.addEventListener('click', () => {
      const ROOM_DEFAULTS = ['Living Room','Kitchen','Master Bath','Bathroom 2','Bedroom 1','Bedroom 2','Bedroom 3','Basement','Dining Room','Hallway','Laundry Room','Garage','Exterior','Other'];
      const used = state.xaRooms.map(r => r.name);
      const next = ROOM_DEFAULTS.find(n => !used.includes(n)) || 'Room ' + (state.xaRooms.length + 1);
      const room = { id: 'r' + Date.now(), name: next, l: '', w: '', ceilH: '', condition: state.xaMeta.condition || 'Average', lines: [] };
      state.xaRooms.push(room);
      state.xaMeta.activeRoom = room.id;
      state.xaMeta.activeLevel = 3;
      saveState(); render();
    });
  }

  // Toggle room expand
  document.querySelectorAll('[data-xa-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const rid = el.dataset.xaToggle;
      state.xaMeta.activeRoom = state.xaMeta.activeRoom === rid ? null : rid;
      saveState(); render();
    });
  });

  // Delete room
  document.querySelectorAll('[data-xa-del-room]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rid = btn.dataset.xaDelRoom;
      state.xaRooms = state.xaRooms.filter(r => r.id !== rid);
      if (state.xaMeta.activeRoom === rid) state.xaMeta.activeRoom = null;
      saveState(); render();
    });
  });

  // Room dimension inputs
  document.querySelectorAll('[data-xa-dim]').forEach(input => {
    input.addEventListener('change', () => {
      const rid = input.dataset.room;
      const dim = input.dataset.xaDim;
      const room = state.xaRooms.find(r => r.id === rid);
      if (room) { room[dim] = input.value; saveState(); render(); }
    });
  });

  // Scope toggles — add/remove all lines for a trade
  document.querySelectorAll('[data-xa-scope]').forEach(el => {
    el.addEventListener('click', () => {
      const trade = el.dataset.xaScope;
      const rid = el.dataset.room;
      const room = state.xaRooms.find(r => r.id === rid);
      if (!room) return;
      const hasAny = room.lines.some(l => l.trade === trade);
      if (hasAny) {
        // remove all lines for this trade
        room.lines = room.lines.filter(l => l.trade !== trade);
      } else {
        // add default lines for this trade
        const tradeLines = XA_LINES[trade] || [];
        const newLines = tradeLines.map(tl => ({
          ...tl,
          trade,
          qty: 1,
        }));
        room.lines = room.lines.concat(newLines);
      }
      saveState(); render();
    });
  });

  // Qty inputs
  document.querySelectorAll('[data-xa-qty]').forEach(input => {
    input.addEventListener('change', () => {
      const rid = input.dataset.room;
      const li = parseInt(input.dataset.li);
      const room = state.xaRooms.find(r => r.id === rid);
      if (room && room.lines[li] !== undefined) {
        room.lines[li].qty = parseFloat(input.value) || 1;
        saveState(); render();
      }
    });
  });

  // Delete line item
  document.querySelectorAll('[data-xa-del-line]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rid = btn.dataset.room;
      const li = parseInt(btn.dataset.li);
      const room = state.xaRooms.find(r => r.id === rid);
      if (room) { room.lines.splice(li, 1); saveState(); render(); }
    });
  });

  // Add custom line item
  document.querySelectorAll('[data-xa-add-line]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rid = btn.dataset.room;
      const room = state.xaRooms.find(r => r.id === rid);
      if (!room) return;
      room.lines.push({
        code: 'CUST' + String(room.lines.length + 1).padStart(3,'0'),
        desc: 'Custom line item',
        unit: 'SF',
        trade: 'Other',
        qty: 1,
        laborUnit: 0,
        matUnit: 0,
      });
      saveState(); render();
    });
  });

  // PDF export
  const pdfBtn = document.getElementById('xa-pdf-btn');
  if (pdfBtn) {
    pdfBtn.addEventListener('click', () => {
      if (!state.xaRooms.length) { showToast('Add rooms before exporting PDF'); return; }
      xaExportPDF();
    });
  }
}

function xaExportPDF() {
  if (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined') {
    showToast('PDF library not loaded — try again in a moment');
    return;
  }
  const { jsPDF } = window.jspdf || window;
  const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'letter' });
  const meta = state.xaMeta;
  const sm = stateInfo(meta.state).laborRate;
  const cond = meta.condition || 'Average';
  const grand = xaGrandTotal();
  const base = grand / (1 + XA_OHP);
  const ohpAmt = grand - base;
  const W = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 60;

  // Header
  doc.setFillColor(30,64,175);
  doc.rect(0,0,W,50,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text('ROOM-BY-ROOM ESTIMATE', margin, 30);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(`${state.settings.company}  ·  ${state.settings.owner}  ·  ${new Date().toLocaleDateString()}`, margin, 44);
  doc.text('Xactimate-Style · NE Regional Pricing', W - margin, 44, {align:'right'});

  doc.setTextColor(30,30,30);

  // Project info block
  y = 70;
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('PROJECT DETAILS', margin, y); y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  const details = [
    [`Type`, meta.projectType||'—'],
    [`Address`, meta.address||'—'],
    [`State / Market`, `${stateInfo(meta.state).name} (labor ×${stateInfo(meta.state).laborRate.toFixed(2)})`],
    [`Condition`, `${cond} (${Math.round((XA_DEPR[cond]||0.15)*100)}% mat. depr.)`],
    [`Tier`, TIERS[meta.tier]?.name||meta.tier],
    [`Total SF`, meta.sqft||'—'],
    [`Stories`, meta.stories||'—'],
    [`Year Built`, meta.yearBuilt||'—'],
  ];
  details.forEach(([k,v]) => {
    doc.setFont('helvetica','bold'); doc.text(k + ':', margin, y);
    doc.setFont('helvetica','normal'); doc.text(String(v), margin + 110, y);
    y += 13;
  });

  // KPIs
  y += 8;
  doc.setDrawColor(200,210,230); doc.setLineWidth(0.5);
  doc.line(margin, y, W - margin, y); y += 14;
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('ESTIMATE SUMMARY', margin, y); y += 14;
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  [[`Base Cost (Labor + Material)`, base],[`Overhead & Profit (${Math.round(XA_OHP*100)}%)`, ohpAmt],[`Grand Total — RCV`, grand]].forEach(([k,v]) => {
    doc.setFont('helvetica', k.includes('Grand')?'bold':'normal');
    doc.text(k, margin, y);
    doc.text('$' + Math.round(v).toLocaleString('en-US'), W - margin, y, {align:'right'});
    y += 13;
  });

  y += 10;
  doc.line(margin, y, W - margin, y); y += 14;

  // Room-by-room sections
  state.xaRooms.forEach(room => {
    const roomRcv = xaRoomTotal(room, sm);
    if (y > 680) { doc.addPage(); y = 50; }
    doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.setFillColor(240,244,255);
    doc.rect(margin, y-10, W-2*margin, 16,'F');
    doc.text(room.name.toUpperCase(), margin+4, y);
    doc.text('$' + Math.round(roomRcv).toLocaleString('en-US'), W-margin, y, {align:'right'});
    y += 16;

    if (room.l && room.w) {
      doc.setFontSize(8); doc.setFont('helvetica','normal');
      const fl = (parseFloat(room.l)||0)*(parseFloat(room.w)||0);
      doc.text(`Dimensions: ${room.l}×${room.w}${room.ceilH?' ×'+room.ceilH+'H':''} ft  |  Floor: ${fl} SF`, margin+4, y);
      y += 12;
    }

    // Column headers
    doc.setFontSize(7.5); doc.setFont('helvetica','bold');
    const cols = [margin+4, margin+180, margin+210, margin+240, margin+290, margin+330, margin+370, margin+415];
    ['Description','Unit','Qty','Labor $','Material $','RCV','Depr.','ACV'].forEach((h,i) => {
      doc.text(h, cols[i], y, {align: i>1?'right':'left'});
    });
    y += 10;
    doc.setLineWidth(0.3); doc.line(margin,y,W-margin,y); y+=6;

    room.lines.forEach(l => {
      if (y > 700) { doc.addPage(); y = 50; }
      const c = xaCalcLine(l, sm, cond);
      doc.setFontSize(7.5); doc.setFont('helvetica','normal');
      const descTrunc = l.desc.length > 34 ? l.desc.slice(0,33)+'…' : l.desc;
      doc.text(descTrunc, cols[0], y);
      doc.text(l.unit, cols[1], y, {align:'right'});
      doc.text(String(l.qty||1), cols[2], y, {align:'right'});
      doc.text('$'+Math.round(c.labor).toLocaleString('en-US'), cols[3], y, {align:'right'});
      doc.text('$'+Math.round(c.mat).toLocaleString('en-US'), cols[4], y, {align:'right'});
      doc.text('$'+Math.round(c.rcv).toLocaleString('en-US'), cols[5], y, {align:'right'});
      doc.text('$'+Math.round(c.depr).toLocaleString('en-US'), cols[6], y, {align:'right'});
      doc.text('$'+Math.round(c.acv).toLocaleString('en-US'), cols[7], y, {align:'right'});
      y += 11;
    });
    y += 8;
  });

  // Footer
  if (y > 680) { doc.addPage(); y = 50; }
  y += 6;
  doc.setLineWidth(0.5); doc.line(margin,y,W-margin,y); y += 12;
  doc.setFontSize(7.5); doc.setFont('helvetica','normal'); doc.setTextColor(120,120,120);
  doc.text(`NE regional rates based on RSMeans / Xactimate 2024 data. Labor market adjustments applied per state. All quantities are estimates; field verification required before contract execution.`, margin, y, {maxWidth: W-2*margin});

  const fname = `Xactimate-Estimate-${meta.address ? meta.address.replace(/[^a-z0-9]/gi,'-').slice(0,30) : 'Project'}-${new Date().toISOString().slice(0,10)}.pdf`;
  doc.save(fname);
  showToast('PDF exported: ' + fname);
}
