        <input class="input mono" id="settings-openai-key" type="password" placeholder="sk-proj-..." value="${state.settings.openaiKeyOverride||''}" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-primary" id="save-openai-key-btn">${ico('check')} Save Key</button>
        <button class="btn btn-ghost" id="clear-openai-key-btn">Clear</button>
        <span id="openai-key-status" style="font-size:12px;color:var(--text-muted);"></span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="card">
      <h3>About</h3>
      <p class="muted" style="font-size: 13.5px;">Kunstruction1 — field intelligence for Northeast general contractors. Flash estimates, job lifecycle, homeowner portals, and invoice workflows in one tool.</p>
    </div>
  `;
}

// ---------- HOMEOWNER PORTAL ----------
function renderPortal() {
  const p = state.projects.find(x => x.id === currentView.params.id);
  if (!p) return `<div class="content"><div class="empty"><h3>Project not found</h3></div></div>`;
  const isCustomer = currentView.params.customer === true;
  const est = p.estimate;
  const pendingCOs = p.changeOrders.filter(c => c.status === 'pending');
  const approvedCOs = p.changeOrders.filter(c => c.status === 'approved');
  const openBalance = p.invoices.filter(i => i.status !== 'paid').reduce((s,i) => s + i.amount, 0);
  const greeting = p.client.split('&')[0].trim();
  const needsApproval = p.estimateStatus !== 'approved' && est;

  return `
    <div style="background: var(--bg); min-height: 100vh;">
      <div style="max-width: 900px; margin: 0 auto; padding: 32px 20px;">
        <div class="row" style="justify-content: space-between; margin-bottom: 20px;">
          <div class="row" style="gap: 10px;">
            <div class="logo" style="width: 36px; height: 36px; border-radius: 8px; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 700;">K</div>
            <div>
              <div style="font-weight: 600;">${state.settings.company}</div>
              <div class="muted" style="font-size: 12px;">${[state.settings.nyHic, state.settings.njHic, state.settings.ctLic, state.settings.maLic, state.settings.paLic].filter(Boolean).join(' · ')}</div>
            </div>
          </div>
          ${isCustomer ? '' : `<button class="btn btn-ghost btn-sm" data-nav="project" data-nav-params='${JSON.stringify({id:p.id})}'>${ico('back')}Exit preview</button>`}
        </div>

        <div class="portal-hero">
          <div class="tag" style="background: rgba(255,255,255,0.2); color: #fff; margin-bottom: 10px;">${isCustomer ? 'Your project' : 'Homeowner portal — preview'}</div>
          <h2>${p.name}</h2>
          <p>Welcome, ${greeting}. Here's where your project stands.</p>
        </div>

        ${needsApproval ? renderPortalEstimate(p) : `
          <div class="kpi-grid">
            <div class="kpi"><div class="label">Progress</div><div class="value mono">${progressPct(p)}%</div><div class="delta">${p.tasks.filter(t=>t.done).length} of ${p.tasks.length} tasks done</div></div>
            <div class="kpi"><div class="label">Latest update</div><div class="value">${p.logs[0]?.date || '—'}</div><div class="delta">${p.logs[0]?.weather || 'No log yet'}</div></div>
            <div class="kpi accent"><div class="label">Balance due</div><div class="value mono">${fmtUsd(openBalance)}</div><div class="delta">${p.invoices.filter(i => i.status === 'sent').length} open invoice(s)</div></div>
          </div>
        `}

        ${pendingCOs.length > 0 ? `
        <div class="card" style="margin-bottom: 16px; border: 2px solid var(--orange);">
          <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
            <h3 style="margin: 0;">Action needed: change order${pendingCOs.length > 1 ? 's' : ''}</h3>
            <span class="tag tag-yellow">${pendingCOs.length} pending</span>
          </div>
          <div class="muted" style="font-size: 13px; margin-bottom: 12px;">Review the change${pendingCOs.length > 1 ? 's' : ''} below and approve to keep the project on track.</div>
          ${pendingCOs.map(c => `
            <div class="list-item" style="flex-direction: column; align-items: stretch; gap: 8px;">
              <div class="row" style="justify-content: space-between;">
                <div>
                  <div class="list-item-title">${c.title}</div>
                  <div class="list-item-sub">${c.date}${c.description ? ' · ' + c.description : ''}</div>
                </div>
                <div class="mono" style="font-weight: 600; font-size: 16px;">${c.amount >= 0 ? '+' : ''}${fmtUsd(c.amount)}</div>
              </div>
              <div class="row" style="gap: 8px;">
                <button class="btn btn-success btn-sm" data-portal-sign-co="${p.id}:${c.id}">${ico('check')}Approve & sign</button>
                <button class="btn btn-ghost btn-sm" data-portal-reject-co="${p.id}:${c.id}">Decline</button>
              </div>
            </div>
          `).join('')}
        </div>
        ` : ''}

        ${!needsApproval ? renderPortalProgress(p) : ''}
        ${!needsApproval && p.logs.length > 0 ? renderPortalLogs(p) : ''}
        ${!needsApproval && p.schedule && p.schedule.phases && p.schedule.phases.length ? renderPortalSchedule(p) : ''}
        ${!needsApproval && (p.photos || []).length > 0 ? renderPortalPhotos(p) : ''}

        ${renderPortalNotes(p, isCustomer)}

        ${approvedCOs.length > 0 ? `
        <div class="card" style="margin-bottom: 16px;">
          <h3>Approved change orders</h3>
          ${approvedCOs.map(c => `
            <div class="list-item">
              <div class="list-item-main">
                <div class="list-item-title">${c.title}</div>
                <div class="list-item-sub">${c.date} · Signed by ${c.signature?.name || 'homeowner'} on ${c.signature?.date || c.date}</div>
              </div>
              <div class="list-item-value"><div class="mono" style="font-weight: 600;">${c.amount >= 0 ? '+' : ''}${fmtUsd(c.amount)}</div></div>
            </div>
          `).join('')}
        </div>
        ` : ''}

        ${p.invoices.length > 0 ? `
        <div class="card" style="margin-bottom: 16px;">
          <h3>Invoices</h3>
          ${p.invoices.map(i => `
            <div class="list-item">
              <div class="list-item-main">
                <div class="list-item-title">${i.number} — ${fmtUsd(i.amount)}</div>
                <div class="list-item-sub">${i.description || ''}</div>
              </div>
              <div class="list-item-value">
                <span class="tag tag-${i.status === 'paid' ? 'green' : 'blue'}">${i.status}</span>
                <div class="row" style="gap: 6px; margin-top: 6px;">
                  <button class="btn btn-ghost btn-sm" data-download-invoice="${p.id}:${i.id}">${ico('download')}PDF</button>
                  ${i.status !== 'paid' && !isCustomer ? `<button class="btn btn-success btn-sm" data-portal-pay="${p.id}:${i.id}">Mark paid</button>` : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        ` : ''}

        <div class="muted" style="text-align: center; font-size: 12px; margin-top: 24px; line-height: 1.7;">
          Questions? Reply to <a href="mailto:${state.settings.email}" style="color: var(--orange);">${state.settings.email}</a> or call <a href="tel:${state.settings.phone}" style="color: var(--orange);">${state.settings.phone}</a>.<br>
          ${stateInfo(p.state).hicLaw} · ${stateInfo(p.state).invoiceLaw}
        </div>
      </div>
    </div>
  `;
}


// =====================================================
//   CLIENT PORTAL — HELPER SECTIONS
// =====================================================

function renderPortalProgress(p) {
  const done = p.tasks.filter(t => t.done).length;
  const total = p.tasks.length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const milestones = (p.milestones || []);
  const si = stateInfo(p.state);

  // Determine current phase label from milestones
  const nextMilestone = milestones.find(m => !m.done);
  const lastMilestone = [...milestones].reverse().find(m => m.done);
  const phaseLabel = nextMilestone ? 'Working toward: ' + nextMilestone.title : (lastMilestone ? lastMilestone.title : 'In progress');

  return `
    <div class="card" style="margin-bottom: 16px;">
      <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="margin:0;">Project progress</h3>
        <span class="tag tag-green">${pct}% complete</span>
      </div>

      <!-- Big progress bar -->
      <div style="background: var(--surface-2); border-radius: 99px; height: 12px; overflow: hidden; margin-bottom: 8px;">
        <div style="height: 100%; width: ${pct}%; background: linear-gradient(90deg, var(--orange), #ff9a56); border-radius: 99px; transition: width .4s;"></div>
      </div>
      <div class="muted" style="font-size: 12px; margin-bottom: 20px;">${done} of ${total} tasks complete · ${phaseLabel}</div>

      <!-- Milestone timeline -->
      ${milestones.length > 0 ? `
      <div style="position: relative; padding-left: 20px;">
        <div style="position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border);"></div>
        ${milestones.map((m, i) => {
          const isDone = m.done;
          const isNext = !isDone && milestones.slice(0,i).every(x => x.done);
          return `
            <div style="position: relative; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;">
              <div style="position: absolute; left: -20px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: ${isDone ? 'var(--orange)' : isNext ? 'var(--surface)' : 'var(--surface)'}; border: 2px solid ${isDone ? 'var(--orange)' : isNext ? 'var(--orange)' : 'var(--border)'}; display: grid; place-items: center; flex-shrink: 0;">
                ${isDone ? '<svg width="8" height="8" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' : isNext ? '<div style="width:6px;height:6px;border-radius:50%;background:var(--orange);"></div>' : ''}
              </div>
              <div>
                <div style="font-size: 13.5px; font-weight: ${isNext ? '600' : isDone ? '500' : '400'}; color: ${isDone ? 'var(--text-muted)' : 'var(--text)'}; text-decoration: ${isDone ? 'none' : 'none'};">
                  ${isDone ? '✓ ' : ''}${m.title}
                </div>
                ${isDone ? '<div class="muted" style="font-size: 11.5px; margin-top: 1px;">Complete</div>' : isNext ? '<div style="font-size: 11.5px; color: var(--orange); font-weight: 600; margin-top: 1px;">Up next</div>' : '<div class="muted" style="font-size: 11.5px; margin-top: 1px;">Week ' + m.week + '</div>'}
              </div>
            </div>
          `;
        }).join('')}
      </div>
      ` : '<div class="muted" style="font-size: 13px;">Schedule not yet set — check back soon.</div>'}
    </div>
  `;
}

function renderPortalLogs(p) {
  return `
    <div class="card" style="margin-bottom: 16px;">
      <h3>Daily field updates</h3>
      <div class="muted" style="font-size: 12px; margin-bottom: 14px;">What happened on site each day.</div>
      ${p.logs.slice(0, 8).map(l => `
        <div style="padding: 12px 0; border-bottom: 1px solid var(--border);">
          <div class="row" style="justify-content: space-between; margin-bottom: 4px;">
            <div style="font-weight: 600; font-size: 14px;">${l.date}</div>
            <div class="muted" style="font-size: 12px;">${[l.weather, l.crew].filter(Boolean).join(' · ')}</div>
          </div>
          <div style="font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap;">${l.notes || ''}</div>
          ${(l.photos || []).length ? `
            <div style="display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;">
              ${l.photos.map(ph => `<img src="${ph.data}" alt="" style="height: 80px; width: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border);" />`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('')}
      ${p.logs.length > 8 ? `<div class="muted" style="font-size: 12px; text-align: center; padding: 10px 0;">+ ${p.logs.length - 8} more updates</div>` : ''}
    </div>
  `;
}

function renderPortalSchedule(p) {
  const { phases } = computeSchedule(p.schedule);
  if (!phases.length) return '';
  const today = todayISO();
  return `
    <div class="card" style="margin-bottom: 16px;">
      <h3>Project schedule</h3>
      <div class="muted" style="font-size: 12px; margin-bottom: 14px;">Trade sequence and estimated dates. Subject to weather and inspections.</div>
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
          <thead>
            <tr style="text-align: left; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em;">
              <th style="padding: 6px 8px;">Phase</th>
              <th style="padding: 6px 8px;">Trade</th>
              <th style="padding: 6px 8px;">Start</th>
              <th style="padding: 6px 8px;">End</th>
              <th style="padding: 6px 8px;">Duration</th>
            </tr>
          </thead>
          <tbody>
            ${phases.map(ph => {
              const isActive = ph.start <= today && ph.end >= today;
              const isDone = ph.end < today;
              return `
                <tr style="border-top: 1px solid var(--border); background: ${isActive ? 'rgba(255,106,26,0.04)' : 'transparent'};">
                  <td style="padding: 8px; font-weight: ${isActive ? '600' : '400'};">
                    ${isDone ? '✓ ' : isActive ? '→ ' : ''}<span style="color: ${isActive ? 'var(--orange)' : isDone ? 'var(--text-muted)' : 'var(--text)'};">${ph.name}</span>
                  </td>
                  <td style="padding: 8px; color: var(--text-muted);">${ph.trade || ''}</td>
                  <td style="padding: 8px; font-family: monospace; font-size: 12px;">${ph.start || '—'}</td>
                  <td style="padding: 8px; font-family: monospace; font-size: 12px;">${ph.end || '—'}</td>
                  <td style="padding: 8px; color: var(--text-muted);">${ph.duration} day${ph.duration !== 1 ? 's' : ''}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderPortalPhotos(p) {
  const photos = (p.photos || []);
  if (!photos.length) return '';
  const groups = {};
  photos.forEach(ph => { const k = ph.stage || 'Site photos'; (groups[k] = groups[k] || []).push(ph); });
  return `
    <div class="card" style="margin-bottom: 16px;">
      <h3>Progress photos</h3>
      <div class="muted" style="font-size: 12px; margin-bottom: 14px;">${photos.length} photo${photos.length !== 1 ? 's' : ''} from the job site.</div>
      ${Object.keys(groups).map(grp => `
        <div style="margin-bottom: 16px;">
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 8px;">${grp}</div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px;">
            ${groups[grp].map(ph => `
              <div style="border-radius: 8px; overflow: hidden; border: 1px solid var(--border);">
                <img src="${ph.data}" alt="${ph.caption || ''}" style="width: 100%; aspect-ratio: 1; object-fit: cover; display: block;" />
                ${ph.caption ? `<div style="padding: 5px 7px; font-size: 11.5px; color: var(--text-muted);">${ph.caption}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPortalEstimate(p) {
  const est = p.estimate;
  if (!est) return '';
  const currentTier = p.customerTier || est.tier;
  const showTierSwitcher = p.estimateStatus !== 'approved';
  // Tier cards for selection
  const tiers = Object.values(TIERS);
  const baseArea = est.sqft || 0;
  const sentStatus = p.estimateStatus === 'sent' ? 'Waiting on your approval' : 'Draft — not yet sent';
  return `
    <div class="card" style="margin-bottom: 16px; border: 2px solid var(--orange);">
      <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
        <h3 style="margin: 0;">Your estimate</h3>
        <span class="tag tag-yellow">${sentStatus}</span>
      </div>
      <div class="muted" style="font-size: 13px; margin-bottom: 14px;">
        Pick the tier that fits, review the scope, and sign to approve. We'll get started once you do.
      </div>

      ${showTierSwitcher ? `
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px;">
        ${tiers.map(t => {
          // Back out effective multiplier from the stored estimate so each tier shows a proportional total
          const anchorRate = TIERS[est.tier]?.rate || t.rate;
          const mult = est.grandTotal / (baseArea * anchorRate);
          const tierTotal = Math.round(baseArea * t.rate * mult);
          const selected = currentTier === t.key;
          return `
            <button data-portal-pick-tier="${p.id}:${t.key}" style="text-align: left; padding: 14px; border-radius: 12px; border: 2px solid ${selected ? 'var(--orange)' : 'var(--border)'}; background: ${selected ? 'rgba(255,106,26,0.06)' : 'var(--surface)'}; cursor: pointer;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="font-weight: 700;">${t.name}</div>
                ${selected ? '<span class="tag tag-green" style="font-size: 10px;">Selected</span>' : ''}
              </div>
              <div class="mono" style="font-size: 18px; font-weight: 600;">${fmtUsd(tierTotal)}</div>
              <div class="muted" style="font-size: 12px; margin-top: 4px;">${t.desc}</div>
            </button>
          `;
        }).join('')}
      </div>
      ` : ''}

      <div style="background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 14px;">
        <div class="row" style="justify-content: space-between; margin-bottom: 6px;">
          <div class="muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;">Grand total · ${TIERS[currentTier]?.name || est.tier}</div>
          <div class="muted" style="font-size: 12px;">${est.sqft} sq ft</div>
        </div>
        <div class="mono" style="font-size: 30px; font-weight: 700; color: var(--orange);">${fmtUsd(customerTierTotal(p))}</div>
      </div>

      <details style="margin-bottom: 14px;">
        <summary style="cursor: pointer; font-weight: 600; padding: 8px 0;">View scope of work</summary>
        <div style="white-space: pre-line; font-size: 13.5px; color: var(--text-muted); padding: 8px 0 0;">${est.scopeText || generateScopeNarrative(p)}</div>
      </details>

      <div class="row" style="gap: 8px;">
        <button class="btn btn-primary" data-portal-sign-estimate="${p.id}">${ico('check')}Approve & sign estimate</button>
        <button class="btn btn-ghost btn-sm" data-download-estimate="${p.id}">${ico('download')}Download PDF</button>
      </div>
      <div class="muted" style="font-size: 11px; margin-top: 10px;">Typing your name acts as your electronic signature, legally binding under NY and NJ law.</div>
    </div>
  `;
}

function customerTierTotal(p) {
  const est = p.estimate; if (!est) return 0;
  const tier = TIERS[p.customerTier || est.tier];
  if (!tier) return est.grandTotal;
  // If the selected tier matches the estimate's tier, return stored grandTotal
  if (tier.key === est.tier) return est.grandTotal;
  // Otherwise recompute by ratio
  const ratio = tier.rate / (TIERS[est.tier]?.rate || tier.rate);
  return Math.round(est.grandTotal * ratio);
}

function renderPortalNotes(p, isCustomer) {
  const notes = (p.notes || []).slice().sort((a,b) => (a.ts < b.ts ? -1 : 1));
  return `
    <div class="card" style="margin-bottom: 16px;">
      <h3>Notes & messages</h3>
      <div class="muted" style="font-size: 12px; margin-bottom: 12px;">Leave a note for ${isCustomer ? state.settings.company : p.client}. Keep everything about this project in one place.</div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 360px; overflow-y: auto;">
        ${notes.length === 0 ? '<div class="muted" style="font-size: 13px;">No notes yet — start the conversation below.</div>' :
          notes.map(n => {
            const mine = (isCustomer && n.author === 'customer') || (!isCustomer && n.author === 'contractor');
            const authorName = n.author === 'customer' ? (p.client.split('&')[0].trim()) : state.settings.company;
            return `
              <div style="align-self: ${mine ? 'flex-end' : 'flex-start'}; max-width: 78%;">
                <div style="background: ${mine ? 'var(--orange)' : 'var(--surface)'}; color: ${mine ? '#fff' : 'var(--text)'}; border: 1px solid ${mine ? 'var(--orange)' : 'var(--border)'}; border-radius: 12px; padding: 10px 12px;">
                  <div style="font-size: 11px; opacity: 0.75; margin-bottom: 4px; font-weight: 600;">${authorName} · ${n.ts.slice(0,16).replace('T',' ')}</div>
                  <div style="font-size: 13.5px; white-space: pre-wrap;">${escapeHtml(n.body)}</div>
                </div>
              </div>
            `;
          }).join('')}
      </div>
      <form data-portal-add-note="${p.id}:${isCustomer ? 'customer' : 'contractor'}" style="display: flex; gap: 8px; align-items: flex-start;">
        <textarea id="note-input-${p.id}" class="textarea" placeholder="Type a note..." rows="2" style="flex: 1; resize: vertical;"></textarea>
        <button type="submit" class="btn btn-primary">${ico('send')}Post</button>
      </form>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ---------- MODAL ----------
function renderModal() {
  const m = state.modal;
  return `
    <div class="modal-backdrop" data-modal-close>
      <div class="modal" data-modal-stop>
        <div class="modal-head">
          <h3>${m.title}</h3>
          <button class="btn btn-ghost" data-modal-close>${ico('x')}</button>
        </div>
        <div class="modal-body">${m.body}</div>
        ${m.foot ? `<div class="modal-foot">${m.foot}</div>` : ''}
      </div>
    </div>
  `;
}

// ---------- EVENT BINDINGS ----------
function bindEvents() {
  // Navigation
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const name = el.dataset.nav;
      const params = el.dataset.navParams ? JSON.parse(el.dataset.navParams) : {};
      if (name === 'new') resetWizard();
      navigate(name, params);
    };
  });
  document.querySelector('[data-theme-toggle]')?.addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveState(); render();
  });
  document.querySelectorAll('[data-open-project]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); navigate('project', { id: el.dataset.openProject, tab: 'overview' }); };
  });
  document.querySelectorAll('[data-open-bid]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); navigate('bid', { id: el.dataset.openBid }); };
  });
  document.querySelectorAll('[data-open-portal]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); navigate('portal', { id: el.dataset.openPortal }); };
  });
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => navigate('project', { ...currentView.params, tab: el.dataset.tab });
  });

  // Wizard
  document.querySelectorAll('[data-w]').forEach(el => {
    el.oninput = () => {
      const k = el.dataset.w;
      wizard.data[k] = el.tagName === 'INPUT' && el.type === 'number' ? Number(el.value) : el.value;
      if (k === 'sqft') wizard.sqftSource = 'entered manually';
    };
  });
  document.querySelectorAll('[data-w-set]').forEach(el => {
    el.onclick = () => {
      const [k, v] = el.dataset.wSet.split(':');
      wizard.data[k] = v;
      render();
    };
  });
  document.querySelector('[data-wizard-back]')?.addEventListener('click', () => { wizard.step--; render(); });
  document.querySelector('[data-wizard-next]')?.addEventListener('click', () => { wizard.step++; render(); });
  document.querySelector('[data-wizard-generate]')?.addEventListener('click', runFlashEstimate);
  document.querySelector('[data-wizard-save]')?.addEventListener('click', saveNewProject);
  document.querySelector('[data-measure-wizard]')?.addEventListener('click', async () => {
    if (!wizard.planFiles || wizard.planFiles.length === 0) { showToast('Upload plans in the Plans section first'); return; }
    await runMeasureSqft(wizard.planFiles, wizard.data.scopeNotes || '');
  });
  // Apply measured SF to the wizard sqft field (only active outside the takeoff modal)
  if (!state.modal) {
    document.querySelectorAll('[data-apply-sqft]').forEach(b => b.onclick = () => {
      wizard.data.sqft = Number(b.dataset.applySqft);
      wizard.sqftSource = `applied from plan (${b.dataset.applyKey || 'measured'})`;
      showToast('Square footage set to ' + wizard.data.sqft.toLocaleString());
      render();
    });
    // Inline override on the measurement card
    const overrideInput = document.getElementById('measure-override-input');
    const applyBtn = document.querySelector('[data-apply-override]');
    if (overrideInput && applyBtn) {
      applyBtn.onclick = () => {
        const v = Number(overrideInput.value);
        if (!v || v < 10) { showToast('Enter a valid square footage (min 10)'); return; }
        const ai = measureState.result && measureState.result.sqft ? Number(measureState.result.sqft) : null;
        wizard.data.sqft = v;
        wizard.sqftSource = (ai && v !== ai) ? `overridden by you (AI said ${ai.toLocaleString()})` : `measured from plans`;
        showToast('Quoted square footage: ' + v.toLocaleString() + ' sq ft');
        render();
      };
      overrideInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); applyBtn.click(); } };
    }
    document.querySelectorAll('[data-reset-sqft]').forEach(b => b.onclick = () => {
      const ai = Number(b.dataset.resetSqft);
      wizard.data.sqft = ai;
      wizard.sqftSource = `measured from plans`;
      showToast('Reset to AI measurement: ' + ai.toLocaleString() + ' sq ft');
      render();
    });
  }

  // Takeoff
  document.querySelectorAll('[data-open-takeoff]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openTakeoffModal(el.dataset.openTakeoff); };
  });

  // Step-1 plan drop zone
  const dropZone = document.getElementById('plan-drop');
  const pickBtn = document.getElementById('plan-pick-btn');
  const fileInput = document.getElementById('plan-files-input');
  if (dropZone && fileInput) {
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = 'var(--orange-soft)'; };
    dropZone.ondragleave = () => { dropZone.style.background = ''; };
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.style.background = '';
      if (e.dataTransfer?.files) addPlanFiles(e.dataTransfer.files);
    };
    fileInput.onchange = () => { addPlanFiles(fileInput.files); fileInput.value = ''; };
  }
  if (pickBtn && fileInput) pickBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); fileInput.click(); };
  document.querySelectorAll('[data-remove-plan]').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); e.stopPropagation(); removePlanFile(el.dataset.removePlan); };
  });
  const fullBtn = document.getElementById('plan-full-btn');
  if (fullBtn) fullBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); runFullTakeoff(); };


  // Settings
  document.querySelectorAll('[data-s]').forEach(el => {
    el.oninput = () => { state.settings[el.dataset.s] = el.value; };
  });
  document.querySelector('[data-save-settings]')?.addEventListener('click', () => { saveState(); showToast('Settings saved'); });

  // OpenAI key override
  document.getElementById('save-openai-key-btn')?.addEventListener('click', () => {
    const keyEl = document.getElementById('settings-openai-key');
    const statusEl = document.getElementById('openai-key-status');
    if (!keyEl) return;
    const val = keyEl.value.trim();
    if (val && !val.startsWith('sk-')) {
      if (statusEl) statusEl.textContent = '⚠️ Key must start with sk-';
      return;
    }
    state.settings.openaiKeyOverride = val;
    saveState();
    if (statusEl) statusEl.textContent = val ? '✅ Key saved — AI will use your key' : '✅ Cleared — using built-in key';
    showToast(val ? 'Custom OpenAI key saved' : 'Key cleared');
  });
  document.getElementById('clear-openai-key-btn')?.addEventListener('click', () => {
    const keyEl = document.getElementById('settings-openai-key');
    const statusEl = document.getElementById('openai-key-status');
    if (keyEl) keyEl.value = '';
    state.settings.openaiKeyOverride = '';
    saveState();
    if (statusEl) statusEl.textContent = '✅ Cleared — using built-in key';
    showToast('Custom key cleared');
  });
  document.querySelector('[data-export-data]')?.addEventListener('click', exportData);
  document.querySelector('[data-import-data]')?.addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file')?.addEventListener('change', importData);
  document.querySelector('[data-reset-data]')?.addEventListener('click', resetData);

  document.getElementById('add-crew-btn')?.addEventListener('click', () => {
    if (!state.crew) state.crew = [];
    state.crew.push({ id: 'w-' + Date.now(), name: '', role: '', active: true });
    render();
  });
  document.querySelectorAll('[data-remove-crew]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.crew = state.crew.filter(w => w.id !== btn.dataset.removeCrew);
      saveState(); render();
    });
  });
  document.getElementById('save-crew-btn')?.addEventListener('click', () => {
    if (!state.crew) state.crew = [];

      const nameEl = document.querySelector(`[data-crew-name="${w.id}"]`);
      const roleEl = document.querySelector(`[data-crew-role="${w.id}"]`);

  document.querySelectorAll('[data-task-toggle]').forEach(el => {
    el.onchange = () => {
      const [pid, tid] = el.dataset.taskToggle.split(':');
      const p = state.projects.find(x => x.id === pid);
      const t = p.tasks.find(x => x.id === tid);
      t.done = el.checked;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-add-task]').forEach(el => el.onclick = () => openAddTask(el.dataset.addTask));
  document.querySelectorAll('[data-add-log]').forEach(el => el.onclick = () => openAddLog(el.dataset.addLog));
  document.querySelectorAll('[data-add-co]').forEach(el => el.onclick = () => openAddCO(el.dataset.addCo));
  document.querySelectorAll('[data-add-invoice]').forEach(el => el.onclick = () => openAddInvoice(el.dataset.addInvoice));
  document.querySelectorAll('[data-add-photos]').forEach(el => el.onclick = () => openAddPhotos(el.dataset.addPhotos));
  document.querySelectorAll('[data-del-photo]').forEach(el => el.onclick = () => {
    const [pid, idx] = el.dataset.delPhoto.split(':');
    const p = state.projects.find(x => x.id === pid);
    if (!p || !Array.isArray(p.photos)) return;

    saveState(); showToast('Photo deleted'); render();

  document.querySelectorAll('img[data-lightbox]').forEach(el => el.onclick = () => openLightbox(el.src));

  // Schedule
  document.querySelectorAll('[data-gen-schedule]').forEach(el => el.onclick = () => runGenerateSchedule(el.dataset.genSchedule));
  document.querySelectorAll('[data-add-phase]').forEach(el => el.onclick = () => openAddPhase(el.dataset.addPhase));
  document.querySelectorAll('[data-edit-phase]').forEach(el => el.onclick = () => {

    openEditPhase(pid, phid);
  });
  document.querySelectorAll('[data-sched-start]').forEach(el => el.onchange = () => {
    const p = state.projects.find(x => x.id === el.dataset.schedStart);
    if (!p) return;
    if (!p.schedule) p.schedule = { startDate: el.value, phases: [] };

    saveState(); render();
  });

  // Bid actions — use onclick (not addEventListener) so listeners replace on every render, preventing doubles
  const _editScope = document.querySelector('[data-edit-scope]');
  if (_editScope) _editScope.onclick = (e) => openEditScope(e.currentTarget.dataset.editScope);
  const _sendBid = document.querySelector('[data-send-bid]');
  if (_sendBid) _sendBid.onclick = (e) => navigate('send', { id: e.currentTarget.dataset.sendBid });
  const _acceptBid = document.querySelector('[data-accept-bid]');
  if (_acceptBid) _acceptBid.onclick = (e) => { const p = state.projects.find(x=>x.id===e.currentTarget.dataset.acceptBid); p.stage='Accepted'; p.acceptedDate = new Date().toISOString().slice(0,10); saveState(); showToast('Bid marked accepted'); render(); };
  const _declineBid = document.querySelector('[data-decline-bid]');
  if (_declineBid) _declineBid.onclick = (e) => { const p = state.projects.find(x=>x.id===e.currentTarget.dataset.declineBid); p.stage='Declined'; p.status='bid-declined'; saveState(); showToast('Bid marked declined'); render(); };
  const _startProject = document.querySelector('[data-start-project]');
  if (_startProject) _startProject.onclick = (e) => startProject(e.currentTarget.dataset.startProject);

  // Send bid
  const _sendDemo = document.querySelector('[data-send-demo]');
  if (_sendDemo) _sendDemo.onclick = (e) => {
    const p = state.projects.find(x => x.id === e.currentTarget.dataset.sendDemo);
    p.stage = 'Sent'; p.status = 'bid-sent';
    saveState();
    showToast('Demo bid sent — will auto-flip to Viewed in 4s');
    setTimeout(() => { if (p.stage === 'Sent') { p.stage = 'Viewed'; p.status = 'bid-viewed'; saveState(); if (currentView.name !== 'send') render(); } }, 4000);
    navigate('bid', { id: p.id });
  };
  const _sendGmail = document.querySelector('[data-send-gmail]');
  if (_sendGmail) _sendGmail.onclick = (e) => {
    const p = state.projects.find(x => x.id === e.currentTarget.dataset.sendGmail);
    const to = encodeURIComponent(document.getElementById('send-to').value);
    const subject = encodeURIComponent(document.getElementById('send-subject').value);
    const body = encodeURIComponent(document.getElementById('send-body').value);
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`, '_blank');
    p.stage = 'Sent'; p.status = 'bid-sent';
    saveState(); showToast('Opened Gmail — bid marked Sent');
    navigate('bid', { id: p.id });
  };

  // Invoices
  document.querySelectorAll('[data-download-invoice]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); const [pid, iid] = el.dataset.downloadInvoice.split(':'); downloadInvoicePdf(pid, iid); };

  // Portal — change order approval (legacy one-click for GC preview)
  document.querySelectorAll('[data-portal-approve-co]').forEach(el => el.onclick = () => {

    openSignCoModal(pid, cid);
  });
  document.querySelectorAll('[data-portal-sign-co]').forEach(el => el.onclick = () => {
    const [pid, cid] = el.dataset.portalSignCo.split(':');
    openSignCoModal(pid, cid);
  });
  document.querySelectorAll('[data-portal-reject-co]').forEach(el => el.onclick = () => {
    const [pid, cid] = el.dataset.portalRejectCo.split(':');
    const p = state.projects.find(x=>x.id===pid);
    if (!confirm('Decline this change order? You can always ask your contractor to revise it.')) return;
    p.changeOrders.find(c=>c.id===cid).status = 'rejected';
    saveState(); showToast('Change order declined'); render();
  });
  document.querySelectorAll('[data-portal-pay]').forEach(el => el.onclick = () => {
    const [pid, iid] = el.dataset.portalPay.split(':');
    const p = state.projects.find(x=>x.id===pid);
    const inv = p.invoices.find(i=>i.id===iid);
    inv.status = 'paid'; inv.paid = new Date().toISOString().slice(0,10);
    saveState(); showToast('Invoice marked paid'); render();
  });
  document.querySelectorAll('[data-portal-pick-tier]').forEach(el => el.onclick = () => {

    e.preventDefault();
    const [pid, author] = form.dataset.portalAddNote.split(':');
    const ta = document.getElementById('note-input-' + pid);
    const body = (ta?.value || '').trim();
    if (!body) return;
    const p = state.projects.find(x=>x.id===pid);
    p.notes = p.notes || [];
    p.notes.push({ id: 'n'+Date.now(), author, body, ts: new Date().toISOString() });
    saveState(); showToast('Note posted'); render();
  });
  document.querySelectorAll('[data-download-estimate]').forEach(el => el.onclick = () => {
    downloadEstimatePdf(el.dataset.downloadEstimate);
  });
  document.querySelectorAll('[data-download-takeoff]').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    downloadTakeoffPdf(el.dataset.downloadTakeoff);
  });
  document.querySelectorAll('[data-copy-portal-link]').forEach(el => el.onclick = () => {
    const pid = el.dataset.copyPortalLink;
    const p = state.projects.find(x=>x.id===pid);
    if (!p.portalToken) { p.portalToken = 'pt_' + Math.random().toString(36).slice(2, 12); saveState(); }
    const url = location.origin + location.pathname + '#/portal/' + p.portalToken;
    navigator.clipboard.writeText(url).then(() => showToast('Customer link copied')).catch(() => {
      prompt('Copy this customer link:', url);
    });
  });

  // Modal
  document.querySelectorAll('[data-modal-close]').forEach(el => el.onclick = () => { state.modal = null; render(); });
  document.querySelector('[data-modal-stop]')?.addEventListener('click', (e) => e.stopPropagation());

  // Field Mode
  if (currentView.name === 'field') bindFieldModeEvents();
  // Time Clock
  if (currentView.name === 'timeclock') bindTimeClockEvents();
  // Timesheets
  if (currentView.name === 'timesheets') bindTimesheetsEvents();
  // Receipts
  if (currentView.name === 'receipts') bindReceiptsEvents();
  // 2-Week Look Ahead
  if (currentView.name === 'lookahead') bindLookaheadEvents();
  // Weekly Costs
  if (currentView.name === 'weeklycost') bindWeeklyCostEvents();
  if (currentView.name === 'xactimate') bindXactimateEvents();
}

// ---------- SIGNATURES ----------
function openSignEstimateModal(pid) {
  const p = state.projects.find(x => x.id === pid);
  const total = customerTierTotal(p);
  const tierName = TIERS[p.customerTier || p.estimate.tier]?.name || p.estimate.tier;
  state.modal = {
    title: 'Approve & sign estimate',
    body: `
      <div style="font-size: 14px; margin-bottom: 14px;">
        You're approving the <strong>${tierName}</strong> tier estimate for <strong>${p.name}</strong> at <strong>${fmtUsd(total)}</strong>.
      </div>
      <div class="field"><label>Type your full name to sign</label><input class="input" id="sig-name" placeholder="${p.client}" autocomplete="off"/></div>
      <label style="display: flex; gap: 8px; align-items: flex-start; font-size: 13px; margin-top: 8px;">
        <input type="checkbox" id="sig-agree" style="margin-top: 3px;"/>
        <span>I agree this electronic signature is legally binding and authorizes ${state.settings.company} to proceed with the scope of work described at the approved price.</span>
      </label>
    `,
    foot: `<button class="btn btn-ghost" data-modal-close>Cancel</button><button class="btn btn-primary" id="sig-save">Sign & approve</button>`,
  };
  render();
  const sigSaveBtn = document.getElementById('sig-save');
  if (!sigSaveBtn) return;
  sigSaveBtn.onclick = () => {
    const name = document.getElementById('sig-name').value.trim();
    const agreed = document.getElementById('sig-agree').checked;
    if (!name) { showToast('Type your name to sign'); return; }
    if (!agreed) { showToast('Check the agreement box to continue'); return; }
    p.estimateStatus = 'approved';
    p.estimateSignature = { name, date: new Date().toISOString().slice(0,10), ts: new Date().toISOString(), method: 'typed' };
    // Lock in tier if customer picked one
    if (p.customerTier && p.customerTier !== p.estimate.tier) {
      p.tier = p.customerTier;
      p.estimate = buildEstimate(p);
    }
    // Advance to active stage if it was a bid
    if (p.stage === 'bid' || p.stage === 'intake') p.stage = 'active';
    if (p.bid) p.bid.status = 'accepted';
    state.modal = null;
    saveState();
    showToast('Estimate approved. Welcome aboard.');
    render();
  };
}

// ---------- WIZARD ACTIONS ----------
function runFlashEstimate() {
  // Validate step 2
  if (!wizard.data.sqft || wizard.data.sqft < 10) { showToast('Enter a valid square footage'); return; }
  wizard.step = 3;
  wizard.generating = true;
  wizard.generateStep = 0;
  render();
  const total = 6;
  const tick = () => {
    wizard.generateStep++;
    if (wizard.generateStep >= total) {
      wizard.generating = false;
      wizard.estimate = buildEstimate(wizard.data, wizard.takeoff);
      render();
    } else {
      render();
      setTimeout(tick, 380);
    }
  };
  setTimeout(tick, 380);
}

function saveNewProject() {
  const d = wizard.data;
  if (!d.name) { showToast('Add a project name first'); wizard.step = 1; render(); return; }
  const id = 'p' + Date.now();
  const p = {
    id,
    name: d.name,
    client: d.client,
    clientEmail: d.clientEmail,
    address: d.address,
    state: d.state,
    projectType: d.projectType,
    sqft: Number(d.sqft),
    tier: d.tier,
    status: 'bid-draft',
    stage: 'Draft',
    scopeNotes: d.scopeNotes,
    createdAt: new Date().toISOString().slice(0,10),
    estimate: wizard.estimate,
    takeoff: wizard.takeoff || null,
    schedule: wizard.schedule || null,
    tasks: [], milestones: [], logs: [], changeOrders: [], invoices: [], budget: [],
  };
  state.projects.unshift(p);
  saveState();
  showToast('Bid saved as draft');
  resetWizard();
  navigate('bid', { id });
}

// Core: fetch schedule from AI given project-like attrs. Returns {startDate, phases[]} or null.
async function fetchAiSchedule({ projectType, sqft, tier, state: st, scopeNotes, takeoff }) {
  let takeoff_summary = '';
  if (takeoff) {
    const mats = (takeoff.materials || []).slice(0, 10).map(m => m.name || m.item || '').filter(Boolean).join(', ');
    const labs = (takeoff.labor || []).slice(0, 10).map(l => l.trade || l.name || '').filter(Boolean).join(', ');
    takeoff_summary = `Materials: ${mats}. Labor trades: ${labs}.`.slice(0, 800);
  }
  const res = await fetch(TAKEOFF_API + '/api/schedule', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      projectType: projectType || 'Remodel',
      sqft: sqft || 200,
      tier: tier || 'mid',
      state: st || 'NJ',
      scope_notes: scopeNotes || '',
      takeoff_summary,
    }),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
  if (!Array.isArray(data.phases) || data.phases.length === 0) throw new Error('AI returned no phases');
  return {
    startDate: todayISO(),
    phases: data.phases.map(ph => ({
      id: ph.id || ('ph' + Math.random().toString(36).slice(2, 8)),
      name: ph.name,
      trade: ph.trade || 'Other',
      duration: Math.max(1, Number(ph.duration) || 1),
      dependsOn: Array.isArray(ph.dependsOn) ? ph.dependsOn : [],
      notes: ph.notes || '',
      done: false,
    })),
  };
}

async function runGenerateSchedule(pid) {
  const p = state.projects.find(x => x.id === pid);
  if (!p) return;
  showToast('Generating schedule...');
  try {
    const sched = await fetchAiSchedule({
      projectType: p.projectType, sqft: p.sqft, tier: p.tier, state: p.state,
      scopeNotes: p.scopeNotes, takeoff: p.estimate && p.estimate.takeoff,
    });
    // Preserve existing startDate if user had set one
    if (p.schedule && p.schedule.startDate) sched.startDate = p.schedule.startDate;
    p.schedule = sched;
    saveState();
    showToast('Schedule generated: ' + sched.phases.length + ' phases');
    render();
  } catch (e) {
    showToast('Schedule generation failed: ' + (e.message || e));
  }
}

// Shared helper: compress+resize an image File into a JPEG data URL (keeps things small for the in-memory store)
async function fileToResizedDataUrl(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function startProject(pid) {
  const p = state.projects.find(x => x.id === pid);
  const si = stateInfo(p.state);
  p.status = 'active';
  p.startDate = new Date().toISOString().slice(0,10);

  // Seed project-type-aware tasks
  if (p.tasks.length === 0) {
    const template = getTaskTemplate(p.projectType, p.state);
    template.forEach(g => g.items.forEach(item => p.tasks.push({
      id: 't' + Math.random().toString(36).slice(2,10),
      title: item,
      trade: g.trade,
      done: false,
      createdAt: new Date().toISOString().slice(0,10)
    })));
  }

  // Seed milestones
  if (p.milestones.length === 0) {
    const weeks = Math.max(4, Math.ceil(p.sqft / 55));
    p.milestones = [
      { id: 'm1', title: 'Demo complete',             week: 1, done: false },
      { id: 'm2', title: 'Rough-ins complete',        week: Math.round(weeks * 0.25), done: false },
      { id: 'm3', title: 'Rough inspections passed (' + si.permitName + ')', week: Math.round(weeks * 0.35), done: false },
      { id: 'm4', title: 'Drywall / enclosure complete', week: Math.round(weeks * 0.55), done: false },
      { id: 'm5', title: 'Finishes installed',        week: Math.round(weeks * 0.80), done: false },
      { id: 'm6', title: 'Punch list complete',       week: Math.round(weeks * 0.92), done: false },
      { id: 'm7', title: 'Final inspection & CO',     week: weeks, done: false },
    ];
  }

  // Seed budget from estimate
  if (p.budget.length === 0 && p.estimate) {
    p.budget = [
      { cat: 'Materials',     budgeted: Math.round(p.estimate.materials || 0),  actual: 0 },
      { cat: 'Labor',         budgeted: Math.round(p.estimate.labor || 0),       actual: 0 },
      { cat: 'Subcontractors',budgeted: Math.round(p.estimate.subs || 0),        actual: 0 },
      { cat: 'Permits & Fees',budgeted: Math.round(p.estimate.permits || 0),     actual: Math.round(p.estimate.permits || 0) },
      { cat: 'Misc / Contingency', budgeted: Math.round((p.estimate.grandTotal || 0) * 0.05), actual: 0 },
    ];
  }

  // Seed deposit invoice (standard 1/3 deposit)
  if (p.invoices.length === 0 && p.estimate) {
    const depositAmt = Math.round(p.estimate.grandTotal * 0.33);
    p.invoices.push({
      id: 'inv' + Math.random().toString(36).slice(2,8),
      number: 'INV-' + new Date().getFullYear() + '-' + String(state.projects.length).padStart(3,'0') + '1',
      issued: new Date().toISOString().slice(0,10),
      description: 'Project deposit — 1/3 of contract (' + si.invoiceLaw + ')',
      amount: depositAmt,
      status: 'sent',
    });
  }

  saveState();
  showToast('Project started — tasks, schedule, budget & deposit invoice seeded');
  navigate('project', { id: pid, tab: 'overview' });
}

function downloadTakeoffPdf(pid) {
  const p = state.projects.find(x => x.id === pid);
  if (!p || !p.takeoff) { showToast('No takeoff to export yet'); return; }
  const t = p.takeoff;
  const s = state.settings;
  // Unit-price formatter that preserves cents when needed (e.g. $0.85, $3.25)
  function fmtUsdPrecise(n) {
    const v = Number(n);
    if (!isFinite(v)) return '—';
    const hasCents = Math.round(v * 100) % 100 !== 0;
    return '$' + v.toLocaleString('en-US', { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = 612, H = 792, M = 40;
  let y = 48;
  let pageNum = 1;

  function footer() {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`${s.company}  ·  ${p.name}  ·  Detailed Takeoff`, M, H - 24);
    doc.text(`Page ${pageNum}`, W - M, H - 24, { align: 'right' });
  }
  function newPage() { footer(); doc.addPage(); pageNum++; y = 48; }
  function ensure(space) { if (y + space > H - 56) newPage(); }

  // Header band
  doc.setFillColor(15, 39, 68); doc.rect(0, 0, W, 88, 'F');
  doc.setFillColor(232, 119, 46); doc.rect(0, 88, W, 4, 'F');
  doc.setTextColor(244, 240, 230);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
  doc.text('DETAILED TAKEOFF', M, 44);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(`${s.company}  ·  ${s.phone}  ·  ${s.email}`, M, 62);
  doc.setFontSize(8); doc.setTextColor(200, 210, 220);
  doc.text(`${s.nyHic || ''}   ${s.njHic || ''}`.trim(), M, 76);

  y = 120;

  // Project block
  doc.setTextColor(26, 22, 19);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
  doc.text(p.name || 'Untitled project', M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(100);
  doc.text(`Generated ${t.generatedAt ? new Date(t.generatedAt).toLocaleString() : new Date().toLocaleString()}`, W - M, y, { align: 'right' });
  y += 16;
  doc.setFontSize(10.5); doc.setTextColor(60);
  const metaLine = [
    p.client ? `Client: ${p.client}` : null,
    p.address ? p.address : null,
    p.state ? `State: ${p.state}` : null,
    p.projectType ? p.projectType : null,
    p.sqft ? `${p.sqft} sf` : null,
    p.tier && typeof TIERS !== 'undefined' && TIERS[p.tier] ? `${TIERS[p.tier].name} tier` : null,
  ].filter(Boolean).join('  ·  ');
  if (metaLine) { const ml = doc.splitTextToSize(metaLine, W - M*2); doc.text(ml, M, y); y += ml.length * 13; }
  y += 8;

  // Summary / confidence card
  if (t.summary) {
    ensure(70);
    const sumLines = doc.splitTextToSize(t.summary, W - M*2 - 24);
    const h = Math.max(54, sumLines.length * 12 + 22);
    doc.setFillColor(244, 240, 230); doc.setDrawColor(232, 119, 46);
    doc.roundedRect(M, y, W - M*2, h, 6, 6, 'FD');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(204, 101, 31);
    doc.text('SUMMARY', M + 12, y + 16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
    doc.text(sumLines, M + 12, y + 30);
    y += h + 10;
  }

  // Dimensions
  if ((t.dimensions || []).length) {
    ensure(40);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 39, 68);
    doc.text('DIMENSIONS', M, y); y += 14;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(40);
    const colW = (W - M*2 - 12) / 2;
    const rows = t.dimensions.map(d => {
      const val = (d.value || '') + (d.sqft ? `  ·  ${d.sqft} sf` : '');
      return { label: d.label || '', val };
    });
    for (let i = 0; i < rows.length; i += 2) {
      ensure(22);
      const left = rows[i], right = rows[i+1];
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(40);
      doc.text(left.label, M, y);
      if (right) doc.text(right.label, M + colW + 12, y);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(100);
      doc.text(left.val, M, y + 12);
      if (right) doc.text(right.val, M + colW + 12, y + 12);
      y += 26;
    }
    y += 6;
  }

  // Table header helper
  function drawColHeader(cols) {
    doc.setDrawColor(15, 39, 68); doc.setLineWidth(0.8);
    doc.line(M, y, W - M, y); y += 12;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(100);
    cols.forEach(c => { doc.text(c.label, c.x, y, c.align ? { align: c.align } : undefined); });
    y += 6; doc.setDrawColor(220, 215, 205); doc.setLineWidth(0.4);
    doc.line(M, y, W - M, y); y += 10;
    doc.setLineWidth(0.8);
  }

  // Materials
  const materials = t.materials || [];
  const matTotal = t.totals?.materials ?? materials.reduce((a, m) => a + (Number(m.total) || 0), 0);
  if (materials.length) {
    ensure(50);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 39, 68);
    doc.text('MATERIALS', M, y);
    doc.text(fmtUsd(matTotal), W - M, y, { align: 'right' });
    y += 6;
    const cols = [
      { label: 'ITEM', x: M },
      { label: 'QTY', x: 340, align: 'right' },
      { label: 'UNIT', x: 395, align: 'right' },
      { label: 'UNIT $', x: 470, align: 'right' },
      { label: 'TOTAL', x: W - M, align: 'right' },
    ];
    drawColHeader(cols);

    const byCat = {};
    materials.forEach(m => { (byCat[m.category || 'Other'] = byCat[m.category || 'Other'] || []).push(m); });
    Object.keys(byCat).forEach(cat => {
      ensure(22);
      doc.setFillColor(244, 240, 230); doc.rect(M, y - 9, W - M*2, 16, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(100);
      doc.text(cat.toUpperCase(), M + 4, y + 2);
      y += 14;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
      byCat[cat].forEach(m => {
        const itemLines = doc.splitTextToSize(String(m.item || ''), 290);
        const noteLines = m.notes ? doc.splitTextToSize(String(m.notes), 290) : [];
        const rowH = Math.max(14, itemLines.length * 12) + (noteLines.length ? noteLines.length * 10 + 2 : 0);
        ensure(rowH + 4);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
        doc.text(itemLines, M, y);
        const qtyStr = (m.qty != null ? Number(m.qty).toLocaleString() : '—');
        doc.text(qtyStr, 340, y, { align: 'right' });
        doc.text(String(m.unit || ''), 395, y, { align: 'right' });
        doc.text(m.unit_cost != null ? fmtUsdPrecise(m.unit_cost) : '—', 470, y, { align: 'right' });
        doc.setFont('helvetica', 'bold');
        doc.text(fmtUsd(m.total || 0), W - M, y, { align: 'right' });
        let rowY = y + Math.max(14, itemLines.length * 12);
        if (noteLines.length) {
          doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(120);
          doc.text(noteLines, M, rowY);
          rowY += noteLines.length * 10 + 2;
        }
        y = rowY + 4;
        doc.setDrawColor(235, 230, 220); doc.line(M, y - 2, W - M, y - 2);
      });
      y += 6;
    });
    y += 4;
  }

  // Labor
  const labor = t.labor || [];
  const labTotal = t.totals?.labor ?? labor.reduce((a, l) => a + (Number(l.total) || 0), 0);
  if (labor.length) {
    ensure(60);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 39, 68);
    doc.text('LABOR', M, y);
    doc.text(fmtUsd(labTotal), W - M, y, { align: 'right' });
    y += 6;
    const cols = [
      { label: 'TRADE / TASK', x: M },
      { label: 'HOURS', x: 400, align: 'right' },
      { label: 'RATE', x: 470, align: 'right' },
      { label: 'TOTAL', x: W - M, align: 'right' },
    ];
    drawColHeader(cols);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(30);
    labor.forEach(l => {
      ensure(24);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(30);
      doc.text(String(l.trade || ''), M, y);
      doc.setFont('helvetica', 'normal');
      doc.text(String(l.hours || 0), 400, y, { align: 'right' });
      doc.text(l.rate ? fmtUsdPrecise(l.rate) + '/hr' : '—', 470, y, { align: 'right' });
      doc.setFont('helvetica', 'bold');
      doc.text(fmtUsd(l.total || 0), W - M, y, { align: 'right' });
      if (l.task) {
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(120);
        const taskLines = doc.splitTextToSize(String(l.task), 340);
        doc.text(taskLines, M, y + 11);
        y += 11 + taskLines.length * 10 + 4;
      } else {
        y += 14;
      }
      doc.setDrawColor(235, 230, 220); doc.line(M, y - 2, W - M, y - 2);
    });
    y += 8;
  }

  // Totals block
  ensure(80);
  doc.setFillColor(15, 39, 68); doc.rect(M, y, W - M*2, 54, 'F');
  doc.setTextColor(244, 240, 230);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text('Materials', M + 14, y + 20);
  doc.text(fmtUsd(matTotal), M + 180, y + 20, { align: 'right' });
  doc.text('Labor', M + 14, y + 38);
  doc.text(fmtUsd(labTotal), M + 180, y + 38, { align: 'right' });
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
  doc.setTextColor(232, 119, 46);
  doc.text('TAKEOFF SUBTOTAL', W - M - 180, y + 24);
  doc.setTextColor(244, 240, 230); doc.setFontSize(16);
  doc.text(fmtUsd(matTotal + labTotal), W - M - 14, y + 36, { align: 'right' });
  y += 66;

  // Assumptions
  if ((t.assumptions || []).length) {
    ensure(40);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(15, 39, 68);
    doc.text('ASSUMPTIONS', M, y); y += 14;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(60);
    t.assumptions.forEach(a => {
      const lines = doc.splitTextToSize('•  ' + a, W - M*2 - 8);
      ensure(lines.length * 12 + 4);
      doc.text(lines, M, y); y += lines.length * 12 + 4;
    });
    y += 4;
  }

  // Confidence footer line
  ensure(24);
  doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(120);
  doc.text(`Confidence: ${t.confidence || 'medium'}  ·  Quantities and pricing generated from uploaded plans; verify before ordering.`, M, y);

  footer();
  const safeName = (p.name || 'project').replace(/[^a-z0-9]+/gi, '-').replace(/(^-|-$)/g, '');
  doc.save(`Takeoff-${safeName}.pdf`);
  showToast('Takeoff PDF downloaded');
}

  doc.text(descLines, 40, y);
  doc.text(fmtUsd(inv.amount), W - 40, y, { align: 'right' });
  y += descLines.length * 13 + 12;
  doc.line(40, y, W - 40, y); y += 16;
  doc.setFont('helvetica', 'bold'); doc.text('Total', 40, y); doc.text(fmtUsd(inv.amount), W - 40, y, { align: 'right' });

  y = 680;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 98, 88);
  const terms = `Payment terms: net 7 days from issue. ${p.state} ${stateInfo(p.state).invoiceLaw} applies. Make payment to ${s.company}, ${s.address}.`;
  doc.text(doc.splitTextToSize(terms, W - 80), 40, y);

  doc.save(`Invoice-${inv.number}-${p.client.replace(/[^a-z0-9]+/gi, '-')}.pdf`);
  showToast('Invoice PDF downloaded');
}

// ---------- DATA ACTIONS ----------
function exportData() {  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kunstructioniq-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.projects || !data.settings) throw new Error('Invalid backup file');
      state = data;
      saveState();
      render();
      showToast('Backup restored');
    } catch (err) {
      showToast('Could not read backup file');
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm('Reset all data? This clears projects, bids, logs, and settings on this device. Cannot be undone.')) return;
  try { delete window.__KIQ_SAVED; } catch (e) {}
  location.reload();
}

// ---------- BOOT ----------
function handlePortalHash() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('/portal/')) {
    const token = h.split('/')[2];
    const p = state.projects.find(x => x.portalToken === token);
    if (p) { currentView = { name: 'portal', params: { id: p.id, customer: true } }; return true; }
  }
  return false;
}
window.addEventListener('hashchange', () => { if (handlePortalHash()) render(); });

// ---------- GEO CHECK-IN ON LAUNCH ----------
function runGeoCheckin() {
  if (!navigator.geolocation) return;
  if (!state.onboarded) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    window.__lastGeo = { lat, lng, ts: Date.now() };

    // Reverse geocode for label
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
      .then(r => r.json())
      .then(d => {
        const addr = d.address || {};
        window.__lastGeoLabel = [addr.road, addr.city || addr.town || addr.village, addr.state].filter(Boolean).join(', ');
      }).catch(() => {});

    // Try to match to nearest active job site (within ~1 mile radius)
    const activeJobs = state.projects.filter(p => p.status === 'active');
    let nearest = null;
    let nearestDist = Infinity;
    activeJobs.forEach(job => {
      if (!job.geoLat || !job.geoLng) return;
      const dLat = (job.geoLat - lat) * 111000;
      const dLng = (job.geoLng - lng) * 111000 * Math.cos(lat * Math.PI / 180);
      const dist = Math.sqrt(dLat*dLat + dLng*dLng);
      if (dist < nearestDist) { nearestDist = dist; nearest = job; }
    });

    if (nearest && nearestDist < 1600) {
      // Within ~1 mile — auto-select this job in time clock + field mode
      window.__tcJob = nearest.id;
      window.__fieldState = window.__fieldState || {};
      window.__fieldState.jobId = nearest.id;
      window.__autoCheckedIn = nearest.name;
      showToast(`📍 Auto-detected: ${nearest.name}`);
      render();
    }
  }, () => {});
}

// PWA install prompt capture
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window.__deferredInstall = e;
  // If user is on Field Mode, re-render to show install banner
  if (currentView && currentView.name === 'field') render();
});
window.addEventListener('appinstalled', () => {
  window.__deferredInstall = null;
});

(function boot() {
  loadState();
  migrateState();
  saveState();
  handlePortalHash();
  render();
  // Geo check-in runs after first render so showToast is available
  setTimeout(runGeoCheckin, 800);
})();
</script>

(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  var scrollRaf=0;
  function emitScroll(){
    scrollRaf=0;
    var x=window.scrollX||window.pageXOffset||0;
    var y=window.scrollY||window.pageYOffset||0;
    window.parent.postMessage({type:'INLINE_EDIT_SCROLL',scrollX:x,scrollY:y},'*');
  }
  window.addEventListener('scroll',function(){
    if(scrollRaf)return;
    scrollRaf=requestAnimationFrame(emitScroll);
  },{passive:true,capture:true});
  emitScroll();
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
