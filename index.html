<style>
  :root {
    --bg: #fbf7f2;
    --surface: #ffffff;
    --surface-2: #f3ede4;
    --border: #e6ddd0;
    --text: #1a1613;
    --text-muted: #6b6258;
    --text-dim: #958a7c;
    --orange: #ff6a1a;
    --orange-dark: #e5591a;
    --orange-soft: #fff1e6;
    --green: #2d9a5f;
    --green-soft: #e1f4ea;
    --red: #d13b2a;
    --red-soft: #fce3df;
    --yellow: #c8860a;
    --yellow-soft: #fbefd1;
    --blue: #2463b3;
    --blue-soft: #e1ecfb;
    --purple: #7a4dd6;
    --purple-soft: #eee6fb;
    --shadow-sm: 0 1px 2px rgba(26,22,19,0.05);
    --shadow-md: 0 4px 12px rgba(26,22,19,0.08);
    --shadow-lg: 0 12px 32px rgba(26,22,19,0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }
  [data-theme="dark"] {
    --bg: #15110e;
    --surface: #1f1a16;
    --surface-2: #2a231d;
    --border: #362d25;
    --text: #f5efe7;
    --text-muted: #b5aa9c;
    --text-dim: #847867;
    --orange-soft: #3a1e0c;
    --green-soft: #143423;
    --red-soft: #3b1711;
    --yellow-soft: #3a2a0b;
    --blue-soft: #152642;
    --purple-soft: #251a3b;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }

  button { font-family: inherit; font-size: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  /* ============ LAYOUT ============ */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .sidebar-brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--orange); color: #fff;
    display: grid; place-items: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .sidebar-brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .sidebar-brand .tag { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .nav-section { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); padding: 14px 10px 6px; font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 10px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; color: var(--text-muted);
    transition: all 0.15s;
    text-align: left;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--orange-soft); color: var(--orange-dark); }
  [data-theme="dark"] .nav-item.active { color: #ffb98a; }
  .nav-item .ico { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }

  .sidebar-footer {
    margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; padding: 12px 10px;
  }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--orange), #c74c16); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .sidebar-footer-info { flex: 1; min-width: 0; }
  .sidebar-footer-info .name { font-size: 13px; font-weight: 600; }
  .sidebar-footer-info .email { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .theme-toggle { padding: 6px; border-radius: 6px; color: var(--text-muted); }
  .theme-toggle:hover { background: var(--surface-2); color: var(--text); }

  /* ============ MAIN ============ */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
  .crumbs .sep { color: var(--text-dim); }
  .crumbs .current { color: var(--text); font-weight: 500; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }

  .content { padding: 28px; max-width: 1400px; width: 100%; }
  @media (min-width: 1400px) { .content { margin: 0 auto; } }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; gap: 20px; flex-wrap: wrap; }
  .page-head h2 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .page-head .sub { color: var(--text-muted); margin-top: 4px; font-size: 14px; }
  .page-head-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: var(--radius-sm);
    font-weight: 500; font-size: 14px;
    transition: all 0.15s;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .btn-primary { background: var(--orange); color: #fff; }
  .btn-primary:hover { background: var(--orange-dark); box-shadow: var(--shadow-md); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-ghost { color: var(--text-muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-danger:hover { background: var(--red); color: #fff; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-success:hover { background: #23804d; }
  .btn-sm { padding: 6px 10px; font-size: 13px; }
  .btn-lg { padding: 12px 20px; font-size: 15px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn .ico { width: 14px; height: 14px; stroke-width: 2.25; }

  /* ============ CARDS ============ */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; letter-spacing: -0.01em; }

  /* KPI grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
  .kpi .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .kpi .value { font-size: 28px; font-weight: 600; margin-top: 8px; letter-spacing: -0.02em; }
  .kpi .delta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .kpi.accent .value { color: var(--orange); }

  /* ============ LISTS ============ */
  .list-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-main { flex: 1; min-width: 0; }
  .list-item-title { font-weight: 500; font-size: 14px; }
  .list-item-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .list-item-value { text-align: right; }

  /* ============ TAGS ============ */
  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .tag-orange { background: var(--orange-soft); color: var(--orange-dark); }
  [data-theme="dark"] .tag-orange { color: #ffb98a; }
  .tag-green { background: var(--green-soft); color: var(--green); }
  .tag-red { background: var(--red-soft); color: var(--red); }
  .tag-yellow { background: var(--yellow-soft); color: var(--yellow); }
  .tag-blue { background: var(--blue-soft); color: var(--blue); }
  .tag-purple { background: var(--purple-soft); color: var(--purple); }
  .tag-gray { background: var(--surface-2); color: var(--text-muted); }

  /* ============ PIPELINE ============ */
  .pipeline { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; }
  .pipeline-col { background: var(--surface-2); border-radius: var(--radius-lg); padding: 12px; min-height: 400px; }
  .pipeline-col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
  .pipeline-col-head h4 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .pipeline-col-count { background: var(--surface); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .bid-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; }
  .bid-card:hover { border-color: var(--orange); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .bid-card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .bid-card-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .bid-card-footer { display: flex; justify-content: space-between; align-items: center; }
  .bid-card-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; }

  /* ============ PROJECT CARDS ============ */
  .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; cursor: pointer; transition: all 0.15s; }
  .project-card:hover { border-color: var(--orange); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .project-card-img { height: 120px; background: linear-gradient(135deg, var(--surface-2), var(--border)); position: relative; overflow: hidden; }
  .project-card-img svg { width: 100%; height: 100%; }
  .project-card-body { padding: 16px; }
  .project-card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .project-card-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
  .project-card-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
  .project-progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .project-progress-bar { height: 100%; background: var(--orange); transition: width 0.3s; }

  /* ============ FORMS ============ */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  .field .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .input, .textarea, .select {
    width: 100%; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
  .textarea { resize: vertical; min-height: 80px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 500;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--orange); }
  .chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }

  .tier-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .tier-card {
    padding: 14px;
    border: 2px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface);
    cursor: pointer; transition: all 0.15s;
    text-align: left;
  }
  .tier-card:hover { border-color: var(--orange); }
  .tier-card.active { border-color: var(--orange); background: var(--orange-soft); }
  [data-theme="dark"] .tier-card.active { background: rgba(255,106,26,0.12); }
  .tier-card .tier-name { font-weight: 600; font-size: 13px; }
  .tier-card .tier-rate { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px; margin-top: 4px; }
  .tier-card .tier-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }

  /* ============ WIZARD ============ */
  .wizard-steps { display: flex; gap: 8px; margin-bottom: 24px; padding: 0 4px; }
  .wstep { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .wstep .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--text-muted); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .wstep.active .dot { background: var(--orange); color: #fff; }
  .wstep.done .dot { background: var(--green); color: #fff; }
  .wstep .label { color: var(--text-muted); }
  .wstep.active .label { color: var(--text); font-weight: 600; }
  .wstep .bar { flex: 1; height: 2px; background: var(--border); margin: 0 4px; }
  .wstep.done .bar, .wstep.active .bar { background: var(--orange); }

  /* ============ TABS ============ */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
  .tab { padding: 10px 14px; font-size: 13.5px; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* ============ TABLES ============ */
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; padding: 10px 12px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .table td { padding: 12px; font-size: 14px; border-bottom: 1px solid var(--border); }
  .table tbody tr:hover { background: var(--surface-2); }
  .table tr:last-child td { border-bottom: none; }

  /* ============ FLASH ESTIMATE ============ */
  .flash-stage { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md); background: var(--surface-2); opacity: 0.4; transition: all 0.3s; margin-bottom: 8px; }
  .flash-stage.active { opacity: 1; background: var(--orange-soft); }
  [data-theme="dark"] .flash-stage.active { background: rgba(255,106,26,0.12); }
  .flash-stage.done { opacity: 1; }
  .flash-stage .ind { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex-shrink: 0; }
  .flash-stage.active .ind { border-color: var(--orange); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  .flash-stage.done .ind { background: var(--green); border-color: var(--green); }
  .flash-stage.done .ind::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: grid; place-items: center;
    z-index: 100; padding: 20px;
    animation: fadeIn 0.15s;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    max-width: 560px; width: 100%;
    max-height: 90vh; overflow: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.2s;
  }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 17px; font-weight: 600; }
  .modal-body { padding: 24px; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ============ HOMEOWNER PORTAL ============ */
  .portal-hero { background: linear-gradient(135deg, var(--orange) 0%, #c74c16 100%); color: #fff; padding: 48px 32px; border-radius: var(--radius-xl); margin-bottom: 24px; }
  .portal-hero h2 { font-size: 28px; font-weight: 600; }
  .portal-hero p { opacity: 0.92; margin-top: 8px; font-size: 15px; }

  /* ============ GANTT (legacy) ============ */
  .gantt { display: grid; grid-template-columns: 200px 1fr; gap: 1px; background: var(--border); border-radius: var(--radius-md); overflow: hidden; }
  .gantt-header, .gantt-row { display: contents; }
  .gantt-cell-label { background: var(--surface); padding: 10px 12px; font-size: 13px; }
  .gantt-cell-timeline { background: var(--surface); padding: 10px 12px; position: relative; }

  /* ============ SCHEDULE / NEW GANTT ============ */
  .sched-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .sched-grid { min-width: 780px; display: grid; grid-template-columns: 260px 1fr; }
  .sched-header { display: contents; }
  .sched-header > div { background: var(--surface-2); padding: 10px 12px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 3; }
  .sched-timeline-head { padding: 0 !important; position: relative; }
  .sched-timeline-head-inner { display: grid; height: 100%; }
  .sched-timeline-head-cell { padding: 10px 6px; font-size: 11px; text-align: center; border-left: 1px solid var(--border); color: var(--text-muted); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .sched-timeline-head-cell.weekend { background: var(--surface-3, rgba(0,0,0,0.03)); }
  .sched-timeline-head-cell.month-start { border-left: 2px solid var(--border-strong, var(--border)); font-weight: 700; color: var(--text); }
  .sched-row { display: contents; }
  .sched-row-label { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; background: var(--surface); }
  .sched-row-label:hover { background: var(--surface-2); }
  .sched-row-label.done { opacity: 0.6; }
  .sched-row-label.done .sched-row-name { text-decoration: line-through; }
  .sched-row-timeline { padding: 0; border-bottom: 1px solid var(--border); background: var(--surface); position: relative; min-height: 44px; display: grid; }
  .sched-row-timeline-weekend { background: var(--surface-3, rgba(0,0,0,0.03)); }
  .sched-trade-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sched-bar { position: absolute; top: 8px; bottom: 8px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 11.5px; font-weight: 600; cursor: grab; user-select: none; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sched-bar:active { cursor: grabbing; }
  .sched-bar.done { opacity: 0.55; background: var(--green) !important; }
  .sched-bar.in-progress { box-shadow: 0 0 0 2px var(--orange), 0 1px 2px rgba(0,0,0,0.1); }
  .sched-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 2; pointer-events: none; }
  .sched-today-line::before { content: 'TODAY'; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; letter-spacing: 0.05em; white-space: nowrap; }
  .sched-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 10px 14px; font-size: 11.5px; color: var(--text-muted); }
  .sched-legend-item { display: flex; align-items: center; gap: 6px; }
  .sched-legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .sched-dep-line { position: absolute; background: var(--text-muted); opacity: 0.35; height: 1px; pointer-events: none; z-index: 1; }

  /* Legacy milestone gantt still used in a couple places */
  .gantt-weeks { display: grid; grid-template-columns: repeat(12, 1fr); background: var(--surface); }
  .gantt-week { padding: 6px 4px; font-size: 10.5px; color: var(--text-muted); text-align: center; border-right: 1px solid var(--border); }
  .gantt-week:last-child { border-right: none; }
  .gantt-bar-track { position: relative; height: 24px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .gantt-bar { position: absolute; top: 2px; bottom: 2px; background: var(--orange); border-radius: 3px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; }
  .gantt-bar.complete { background: var(--green); }

  /* ============ BUDGET BARS ============ */
  .budget-row { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }
  .budget-row:last-child { border-bottom: none; }
  .budget-label { font-size: 14px; font-weight: 500; }
  .budget-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .budget-bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .budget-bar { height: 100%; background: var(--green); transition: width 0.3s; }
  .budget-bar.warn { background: var(--yellow); }
  .budget-bar.over { background: var(--red); }
  .budget-num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--text); color: var(--bg);
    padding: 12px 18px; border-radius: var(--radius-md);
    font-size: 13.5px; font-weight: 500;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    animation: toastIn 0.2s;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ============ MOBILE ============ */
  .mobile-nav { display: none; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .content { padding: 16px; padding-bottom: 90px; }
    .topbar { padding: 12px 16px; }
    .tier-grid { grid-template-columns: 1fr; }
    .field-grid { grid-template-columns: 1fr; }
    .pipeline { grid-template-columns: 1fr; }
    .pipeline-col { min-height: auto; }
    .mobile-nav {
      display: grid; grid-template-columns: repeat(5, 1fr);
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 8px; z-index: 30;
    }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px; font-size: 10.5px; color: var(--text-muted); font-weight: 600;
    }
    .mobile-nav-item.active { color: var(--orange); }
    .mobile-nav-item .ico { width: 20px; height: 20px; }
    .page-head h2 { font-size: 22px; }
  }

  /* ============ PDF PREVIEW ============ */
  .pdf-preview { background: #fff; color: #111; padding: 40px; font-family: 'General Sans', sans-serif; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .pdf-preview h1 { font-size: 22px; margin-bottom: 4px; color: #111; }

  /* ============ EMPTY ============ */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 14px; }

  /* Utility */
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .spacer { height: 12px; }
  .muted { color: var(--text-muted); }
  .hidden { display: none !important; }
  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* ============ LANDING PAGE (blueprint + jobsite) ============ */
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  .landing {
    --ink: #0A0F1A;
    --navy: #0F2744;
    --navy-2: #15335a;
    --paper: #F4F0E6;
    --paper-2: #EDE6D4;
    --orange: #E8772E;
    --orange-dark: #cc651f;
    --hazard: #F2C94C;
    --steel: #6B7583;
    --steel-2: #3a4250;
    --rule: rgba(244,240,230,0.14);
    --rule-strong: rgba(244,240,230,0.28);
    min-height: 100vh;
    background: var(--navy);
    color: var(--paper);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    position: relative;
    overflow-x: hidden;
  }
  /* Blueprint grid */
  .landing::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px),
      linear-gradient(var(--rule-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule-strong) 1px, transparent 1px);
    background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
    pointer-events: none;
    z-index: 0;
  }
  .landing-inner { position: relative; z-index: 1; }

  .landing-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 48px;
    border-bottom: 1px solid var(--rule-strong);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .landing-brand {
    display: flex; align-items: center; gap: 12px;
  }
  .landing-brand-mark {
    width: 32px; height: 32px;
    background: var(--orange);
    display: grid; place-items: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700; font-size: 20px;
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }
  .landing-brand-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--paper);
    text-transform: uppercase;
  }
  .landing-nav-meta { color: var(--steel); }
  .landing-nav-meta b { color: var(--paper); font-weight: 500; }

  @media (max-width: 720px) {
    .landing-nav { padding: 16px 20px; }
    .landing-nav-meta { display: none; }
  }

  /* Hero */
  .landing-hero {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 48px;
    padding: 72px 48px 48px;
    max-width: 1360px; margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 980px) {
    .landing-hero { grid-template-columns: 1fr; padding: 48px 24px 32px; gap: 32px; }
  }

  .hero-slug {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 20px;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .hero-slug::before {
    content: ''; width: 28px; height: 2px; background: var(--orange);
  }
  .hero-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: clamp(42px, 6vw, 76px);
    line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--paper);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero-title .underline {
    position: relative;
    display: inline-block;
  }
  .hero-title .underline::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 4px; height: 10px;
    background: var(--orange);
    z-index: -1;
    opacity: 0.85;
  }
  .hero-sub {
    font-size: 17px; line-height: 1.55;
    color: rgba(244,240,230,0.78);
    max-width: 560px;
    margin-bottom: 14px;
  }
  .hero-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--hazard);
    margin-bottom: 32px;
    padding-left: 14px;
    border-left: 3px solid var(--hazard);
  }
  .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; }
  .hero-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 14px;
    border: 2px solid var(--ink);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    text-decoration: none;
  }
  .hero-btn.primary {
    background: var(--orange); color: var(--ink);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
  }
  .hero-btn.primary:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.4); }
  .hero-btn.secondary {
    background: transparent; color: var(--paper);
    border-color: var(--paper);
  }
  .hero-btn.secondary:hover { background: var(--paper); color: var(--navy); }
  .hero-btn svg { width: 16px; height: 16px; }

  /* Hero image (Gantt) */
  .hero-visual {
    position: relative;
    border: 2px solid var(--paper);
    background: var(--paper);
    padding: 10px;
    box-shadow: 10px 10px 0 rgba(0,0,0,0.3);
  }
  .hero-visual::before {
    content: 'FIG-01 · SCHEDULE VIEW';
    position: absolute; top: -11px; left: 14px;
    background: var(--navy);
    color: var(--orange);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    padding: 2px 10px;
    border: 1px solid var(--rule-strong);
  }
  .hero-visual img {
    width: 100%; height: auto; display: block;
    border: 1px solid rgba(10,15,26,0.1);
  }

  /* Corner bolts */
  .hero-visual .bolt { position: absolute; width: 8px; height: 8px; background: var(--ink); border-radius: 50%; }
  .hero-visual .bolt.tl { top: 6px; left: 6px; }
  .hero-visual .bolt.tr { top: 6px; right: 6px; }
  .hero-visual .bolt.bl { bottom: 6px; left: 6px; }
  .hero-visual .bolt.br { bottom: 6px; right: 6px; }

  /* Intake form */
  .intake-section {
    padding: 48px 48px 64px;
    max-width: 1360px; margin: 0 auto;
  }
  @media (max-width: 980px) { .intake-section { padding: 32px 24px 48px; } }

  .intake-panel {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 10px 10px 0 rgba(0,0,0,0.35);
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    position: relative;
  }
  @media (max-width: 900px) { .intake-panel { grid-template-columns: 1fr; } }

  .intake-panel::before {
    content: 'FORM-A · BETA ACCESS REQUEST';
    position: absolute; top: -11px; left: 24px;
    background: var(--orange);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    padding: 2px 10px;
    border: 1px solid var(--ink);
  }

  .intake-left {
    padding: 40px 32px;
    background: var(--paper-2);
    border-right: 1px dashed rgba(10,15,26,0.2);
  }
  @media (max-width: 900px) { .intake-left { border-right: none; border-bottom: 1px dashed rgba(10,15,26,0.2); } }

  .intake-kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--orange-dark);
    margin-bottom: 14px;
  }
  .intake-headline {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 32px;
    line-height: 1.05; letter-spacing: 0;
    text-transform: uppercase;
    margin-bottom: 16px;
    color: var(--ink);
  }
  .intake-body {
    font-size: 14.5px; line-height: 1.55;
    color: #3a3530;
  }
  .intake-list {
    list-style: none; padding: 0; margin: 18px 0 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .intake-list li {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px; color: var(--steel-2);
    padding-left: 22px; position: relative;
  }
  .intake-list li::before {
    content: '■'; position: absolute; left: 0; top: 1px; color: var(--orange);
  }

  .intake-right { padding: 40px 32px; }
  .intake-form { display: grid; gap: 18px; }
  .intake-form label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--steel-2);
    margin-bottom: 6px; display: block;
  }
  .intake-form .req::after { content: ' *'; color: var(--orange-dark); }
  .intake-form input,
  .intake-form select {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--ink);
    padding: 11px 12px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color .12s;
  }
  .intake-form input:focus,
  .intake-form select:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,119,46,0.2); }

  .intake-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .intake-row { grid-template-columns: 1fr; } }

  .state-toggles {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  @media (max-width: 560px) { .state-toggles { grid-template-columns: repeat(4, 1fr); } }
  .state-tog {
    background: #fff;
    border: 1.5px solid var(--ink);
    padding: 10px 0;
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
    transition: background .12s, color .12s;
  }
  .state-tog:hover { background: var(--paper-2); }
  .state-tog.on { background: var(--orange); color: var(--ink); }

  .shop-size {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  @media (max-width: 560px) { .shop-size { grid-template-columns: repeat(2, 1fr); } }
  .size-tog {
    background: #fff;
    border: 1.5px solid var(--ink);
    padding: 10px 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500; font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
  }
  .size-tog:hover { background: var(--paper-2); }
  .size-tog.on { background: var(--orange); border-color: var(--ink); }

  .intake-submit {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 15px 20px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(232,119,46,0.55);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .intake-submit:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(232,119,46,0.7); }
  .intake-submit:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: 4px 4px 0 rgba(232,119,46,0.55); }

  /* Below fold */
  .value-section {
    padding: 64px 48px 32px;
    max-width: 1360px; margin: 0 auto;
    border-top: 1px solid var(--rule-strong);
  }
  @media (max-width: 980px) { .value-section { padding: 48px 24px 24px; } }

  .value-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--orange);
    margin-bottom: 10px;
  }
  .value-h {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: clamp(28px, 3.8vw, 42px);
    line-height: 1.05; text-transform: uppercase;
    margin-bottom: 36px; color: var(--paper);
    max-width: 720px;
  }
  .value-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  }
  @media (max-width: 900px) { .value-grid { grid-template-columns: 1fr; } }
  .value-card {
    border: 1px solid var(--rule-strong);
    padding: 28px 24px 32px;
    background: rgba(15,39,68,0.6);
    position: relative;
  }
  .value-card::before {
    content: attr(data-num);
    position: absolute; top: -11px; left: 20px;
    background: var(--navy);
    color: var(--hazard);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em;
    padding: 2px 10px;
    border: 1px solid var(--rule-strong);
  }
  .value-card h4 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 20px;
    text-transform: uppercase;
    margin-bottom: 10px; color: var(--paper);
  }
  .value-card p {
    font-size: 14.5px; line-height: 1.55;
    color: rgba(244,240,230,0.7);
  }

  .landing-footer {
    padding: 32px 48px 40px;
    max-width: 1360px; margin: 0 auto;
    border-top: 1px solid var(--rule-strong);
    margin-top: 40px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
  }
  @media (max-width: 720px) {
    .landing-footer { padding: 24px 20px 28px; flex-direction: column; gap: 12px; text-align: center; }
  }
  .landing-footer b { color: var(--paper); font-weight: 500; }

/* ── FIELD MODE ── */
.field-shell {
  min-height: 100dvh;
  background: #0a0f1e;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
}
.field-topbar {
  background: #111827;
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky; top: 0; z-index: 50;
}
.field-topbar-title { font-size: 1.05rem; font-weight: 800; }
.field-topbar-title span { color: #f97316; }
.field-gps-chip {
  display: flex; align-items: center; gap: 5px;
  background: rgba(34,197,94,0.12);
  border: 1px solid rgba(34,197,94,0.3);
  color: #22c55e; padding: 4px 10px; border-radius: 999px;
  font-size: 0.72rem; font-weight: 700; cursor: pointer;
}
.field-gps-chip.searching { color: #f97316; border-color: rgba(249,115,22,0.3); background: rgba(249,115,22,0.1); }
.field-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field-job-picker {
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.08);

/* ── RECEIPTS ── */

      if (!state.xaRooms) state.xaRooms = [];
      if (!state.xaMeta) state.xaMeta = { ...defaultState.xaMeta };
    } else {
      state = structuredClone(defaultState);
      // generate estimates for seeded projects
      state.projects.forEach(p => { if (!p.estimate) p.estimate = buildEstimate(p); });
    }
  } catch (e) {
    state = structuredClone(defaultState);
    state.projects.forEach(p => { if (!p.estimate) p.estimate = buildEstimate(p); });
  }
}

  try { window.__KIQ_SAVED = JSON.stringify(state); } catch (e) {}

  let host = document.getElementById('kiq-toast-host');
  if (!host) {
    host = document.createElement('div');
    host.id = 'kiq-toast-host';
    host.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;';
    document.body.appendChild(host);
  }
  const t = document.createElement('div');
  t.textContent = String(msg);
  t.style.cssText = 'background:#1a1613;color:#fffaf5;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:auto;max-width:420px;';

function migrateState() {
  // Backfill fields added in customer-portal update
  state.projects.forEach(p => {
    if (!p.estimateStatus) {
      const s = String(p.status || '').toLowerCase();
      const inFlight = s === 'active' || s === 'punch' || s === 'complete';
      const outForBid = s === 'bid-sent' || s === 'bid';
      p.estimateStatus = inFlight ? 'approved' : outForBid ? 'sent' : 'draft';
    }
    if (p.estimateStatus === 'approved' && !p.estimateSignature) {
      p.estimateSignature = { name: p.client, date: p.acceptedDate || p.createdAt || new Date().toISOString().slice(0,10), method: 'legacy' };
    }
    if (!Array.isArray(p.notes)) p.notes = [];
    if (!p.customerTier && p.estimate?.tier) p.customerTier = p.estimate.tier;
    if (!p.portalToken) p.portalToken = 'pt_' + Math.random().toString(36).slice(2, 12);
    p.changeOrders.forEach(c => {
      if (c.status === 'approved' && !c.signature) c.signature = { name: p.client, date: c.date, method: 'legacy' };
    });
  });
}

function fmtUsd(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtUsdExact(n) {
  // Shows cents only if non-zero, for unit price display accuracy
  const r = Math.round(n * 100) / 100;
  return '$' + r.toLocaleString('en-US', { minimumFractionDigits: r % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
}

function buildEstimate(project, takeoff) {
  const tier = TIERS[project.tier] || TIERS.mid;

  // If we have an AI takeoff, use its real quantities as the source of truth
  if (takeoff && takeoff.materials && takeoff.labor) {
    const materials = takeoff.totals?.materials ?? takeoff.materials.reduce((s,m) => s + (Number(m.total)||0), 0);
    const labor = takeoff.totals?.labor ?? takeoff.labor.reduce((s,l) => s + (Number(l.total)||0), 0);
    const subs = (materials + labor) * 0.06;
    const misc = (materials + labor) * 0.04;
    const base = materials + labor + subs + misc;
    const ohpPct = 0.18;
    const permitsPct = stateInfo(project.state).permitPct;
    const ohpAmt = base * ohpPct;
    const permitAmt = base * permitsPct;

    // Convert takeoff materials + labor into line items
    const lineItems = [];
    takeoff.materials.forEach(m => {
      lineItems.push({
        category: 'Materials',
        name: `${m.category || 'Material'} — ${m.item || ''}`.trim(),
        qty: Number(m.qty) || 1,
        unit: m.unit || 'ea',
        unitPrice: Number(m.unit_cost) || (Number(m.total) / Math.max(1, Number(m.qty) || 1)),
        total: Number(m.total) || 0,
      });
    });
    takeoff.labor.forEach(l => {
      lineItems.push({
        category: 'Labor',
        name: `${l.trade || 'Labor'} — ${l.task || ''}`.trim(),
        qty: Number(l.hours) || 1,
        unit: 'hrs',
        unitPrice: Number(l.rate) || 0,
        total: Number(l.total) || 0,
      });
    });
    lineItems.push({ category: 'Subcontractors', name: 'Specialty trades buffer', qty: 1, unit: 'lot', unitPrice: subs, total: subs });
    lineItems.push({ category: 'Other', name: 'Disposal, equipment rental, cleanup', qty: 1, unit: 'lot', unitPrice: misc, total: misc });

    const subtotal = lineItems.reduce((s, l) => s + l.total, 0);
    const grandTotal = subtotal + ohpAmt + permitAmt;

    return {
      sqft: project.sqft,
      tier: project.tier,
      rate: tier.rate,
      state: project.state,
      materials, labor, subs, misc,
      ohp: ohpAmt, permits: permitAmt,
      subtotal, grandTotal,
      lineItems,
      generatedAt: new Date().toISOString(),
      scopeNarrative: generateScopeNarrative(project),
      source: 'ai-takeoff',
    };
  }

  const target = project.sqft * tier.rate;
  // Distribution based on typical residential GC breakdown
  const materialsPct = 0.42;
  const laborPct = 0.34;
  const subsPct = 0.05;
  const ohp = 0.18;
  const permits = stateInfo(project.state).permitPct;

  const base = target / (1 + ohp + permits);
  const materials = base * materialsPct;
  const labor = base * laborPct;
  const subs = base * subsPct;
  const misc = base - materials - labor - subs;
  const ohpAmt = base * ohp;
  const permitAmt = base * permits;

  const lineItems = [
    { category: 'Materials', name: 'Framing lumber, drywall, insulation', qty: project.sqft, unit: 'sq ft', unitPrice: (materials * 0.22) / project.sqft, total: materials * 0.22 },
    { category: 'Materials', name: 'Finish materials (tile, flooring, paint)', qty: 1, unit: 'lot', unitPrice: materials * 0.30, total: materials * 0.30 },
    { category: 'Materials', name: 'Fixtures & hardware — ' + tier.name.toLowerCase() + ' grade', qty: 1, unit: 'lot', unitPrice: materials * 0.26, total: materials * 0.26 },
    { category: 'Materials', name: 'Cabinetry & millwork', qty: 1, unit: 'lot', unitPrice: materials * 0.22, total: materials * 0.22 },
    { category: 'Labor', name: 'General labor (demo, framing, finish)', qty: Math.round(project.sqft * 0.8), unit: 'hrs', unitPrice: labor * 0.50 / Math.max(1, Math.round(project.sqft * 0.8)), total: labor * 0.50 },
    { category: 'Labor', name: 'Electrical — NY/NJ licensed', qty: 1, unit: 'lot', unitPrice: labor * 0.22, total: labor * 0.22 },
    { category: 'Labor', name: 'Plumbing — NY/NJ licensed', qty: 1, unit: 'lot', unitPrice: labor * 0.20, total: labor * 0.20 },
    { category: 'Labor', name: 'HVAC — NY/NJ licensed', qty: 1, unit: 'lot', unitPrice: labor * 0.08, total: labor * 0.08 },
    { category: 'Subcontractors', name: 'Tile, stone, specialty trades', qty: 1, unit: 'lot', unitPrice: subs, total: subs },
    { category: 'Other', name: 'Disposal, equipment rental, cleanup', qty: 1, unit: 'lot', unitPrice: misc, total: misc },
  ];

  const subtotal = lineItems.reduce((s, l) => s + l.total, 0);
  const grandTotal = subtotal + ohpAmt + permitAmt;

  return {
    sqft: project.sqft,
    tier: project.tier,
    rate: tier.rate,
    state: project.state,
    materials, labor, subs, misc,
    ohp: ohpAmt, permits: permitAmt,
    subtotal, grandTotal,
    lineItems,
    generatedAt: new Date().toISOString(),
    scopeNarrative: generateScopeNarrative(project),
  };
}

function generateScopeNarrative(p) {
  const tier = TIERS[p.tier] || TIERS.mid;
  const stateRef = stateInfo(p.state).code_ref;
  return [
    `**Scope of Work — ${p.projectType}, ${p.sqft} sq ft (${tier.name} tier)**`,
    `Site: ${p.address}`,
    ``,
    `• Full demolition of existing space; disposal per local regulations.`,
    `• Framing and structural modifications as required by scope.`,
    `• Rough mechanical, electrical, and plumbing by NY/NJ-licensed trades.`,
    `• Insulation, drywall, and finish carpentry.`,
    `• ${tier.name} fixtures, cabinetry, and finishes.`,
    `• Tile, flooring, paint, and millwork.`,
    `• All inspections scheduled and coordinated per ${stateRef}.`,
    `• Final punch list and homeowner walkthrough.`,
    ``,
    p.scopeNotes ? `Client notes: ${p.scopeNotes}` : '',
  ].filter(Boolean).join('\n');
}

}

// ---------- HOME ----------
function renderHome() {
  const bids = state.projects.filter(p => ['bid-sent','bid-draft','bid-viewed','bid-declined'].includes(p.status));
  const active = state.projects.filter(p => p.status === 'active');
  const complete = state.projects.filter(p => p.status === 'complete');
  const accepted = state.projects.filter(p => ['active','complete'].includes(p.status)).length;
  const totalBids = state.projects.filter(p => p.status !== 'new').length;
  const winRate = totalBids > 0 ? Math.round((accepted / totalBids) * 100) : 0;
  const pipelineValue = state.projects
    .filter(p => ['bid-sent','bid-draft','bid-viewed'].includes(p.status))
    .reduce((s, p) => s + (p.estimate?.grandTotal || 0), 0);

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const first = state.settings.owner.split(' ')[0];

  return `
    <div class="page-head">
      <div>
        <h2>${greeting}, ${first}.</h2>
        <div class="sub">Saturday · ${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
      </div>
      <div class="page-head-actions">
        <button class="btn btn-secondary" data-nav="pipeline">${ico('pipeline')}View pipeline</button>
        <button class="btn btn-primary" data-nav="new">${ico('plus')}New project</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="label">Open bids</div><div class="value mono">${bids.length}</div><div class="delta">${fmtUsd(pipelineValue)} pipeline</div></div>
      <div class="kpi"><div class="label">Active</div><div class="value mono">${active.length}</div><div class="delta">${active.length > 0 ? 'In progress' : 'None active'}</div></div>
      <div class="kpi"><div class="label">Complete</div><div class="value mono">${complete.length}</div><div class="delta">Past 12 months</div></div>
      <div class="kpi accent"><div class="label">Win rate</div><div class="value mono">${winRate}%</div><div class="delta">${accepted} of ${totalBids || 1} bids</div></div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 14px;">
          <h3 style="margin: 0;">Active projects</h3>
          <button class="btn btn-ghost btn-sm" data-nav="projects">View all${ico('arrow')}</button>
        </div>
        ${active.length === 0 ? '<div class="muted" style="font-size: 13px;">No active projects. Win a bid to start one.</div>' :
          active.map(p => `
          <div class="list-item" data-open-project="${p.id}" style="cursor: pointer;">
            <div class="avatar" style="background: var(--blue); font-size: 11px;">${p.projectType.split(' ')[0].slice(0,2).toUpperCase()}</div>
            <div class="list-item-main">
              <div class="list-item-title">${p.name}</div>
              <div class="list-item-sub">${p.client} · ${p.address.split(',').slice(-2).join(',').trim()}</div>
            </div>
            <div class="list-item-value">
              <div class="mono" style="font-weight: 600; font-size: 13px;">${fmtUsd(p.estimate?.grandTotal || 0)}</div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${progressPct(p)}% complete</div>
            </div>
          </div>
          `).join('')}
      </div>
      <div class="card">
        <h3>Open bids</h3>
        ${bids.length === 0 ? '<div class="muted" style="font-size: 13px;">No open bids.</div>' :
          bids.slice(0, 5).map(p => `
          <div class="list-item" data-open-bid="${p.id}" style="cursor: pointer;">
            <div class="list-item-main">
              <div class="list-item-title">${p.name}</div>
              <div class="list-item-sub">${p.client} · <span class="tag tag-${stageColor(p.stage)}">${p.stage}</span></div>
            </div>
            <div class="list-item-value mono" style="font-weight: 600; font-size: 13px;">${fmtUsd(p.estimate?.grandTotal || 0)}</div>
          </div>
          `).join('')}
      </div>
    </div>
  `;
}

function progressPct(p) {
  if (!p.tasks?.length) return 0;
  return Math.round((p.tasks.filter(t => t.done).length / p.tasks.length) * 100);
}
function stageColor(stage) {
  return { 'Draft':'gray', 'Sent':'blue', 'Viewed':'purple', 'Accepted':'green', 'Declined':'red' }[stage] || 'gray';
}

async function _oai(messages, max_tokens) {
  max_tokens = max_tokens || 900;
  // Allow user-provided key override from Settings
  const activeKey = (state && state.settings && state.settings.openaiKeyOverride && state.settings.openaiKeyOverride.startsWith('sk-'))
    ? state.settings.openaiKeyOverride
    : OPENAI_KEY;
  // Guard: key must be present and look valid
  if (!activeKey || !activeKey.startsWith('sk-')) {
    throw new Error('OpenAI key not configured — check Settings');
  }
  let res;
  try {
    res = await _realFetch(OPENAI_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+activeKey},
      body: JSON.stringify({model:'gpt-4o-mini', messages, max_tokens, response_format:{type:'json_object'}})
    });
  } catch(netErr) {
    // Network-level failure — on GitHub Pages this is almost always an ad blocker
    if (IS_GITHUB_PAGES) {
      throw new _AiBlockedError();
    }
    throw new Error('Network error — check your connection and try again.');
  }
  const d = await res.json();
  if (!res.ok) {
    const msg = (d.error&&d.error.message) || 'OpenAI error ' + res.status;
    if (res.status === 401) throw new Error('OpenAI key invalid or expired');
    if (res.status === 429) throw new Error('OpenAI quota reached — try again in a moment');
    throw new Error(msg);
  }
  return JSON.parse(d.choices[0].message.content);
}

async function _handleApi(ep, opts) {
  const fd = opts && opts.body;
  const gf = function(n){ return fd instanceof FormData ? (fd.get(n)||'') : ''; };
  const gfs = function(n){ return fd instanceof FormData ? fd.getAll(n) : []; };
  async function pdfText(file) {
    if (typeof pdfjsLib==='undefined') return '';
    try {
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:ab}).promise;
      var t='';
      for (var i=1;i<=Math.min(pdf.numPages,6);i++) {
        var pg = await pdf.getPage(i);
        var ct = await pg.getTextContent();
        t += ct.items.map(function(x){return x.str;}).join(' ')+'\n';
      }
      return t.slice(0,4000);
    } catch(e){ return ''; }
  }
  if (ep==='/api/intake-extract') {
    var files=gfs('files'); var txt='';
    for (var fi=0;fi<Math.min(files.length,3);fi++) txt+=await pdfText(files[fi]);
    return _oai([{role:'user',content:'Extract from these construction docs. Return JSON with any of: name, client, clientEmail, address, projectType, state (2-letter), scopeNotes. Docs:\n'+(txt||'none')}], 400);
  }
  if (ep==='/api/measure-sqft') {
    var files=gfs('files'), scope=gf('scope_notes'); var txt='';
    for (var fi=0;fi<Math.min(files.length,3);fi++) txt+=await pdfText(files[fi]);
    return _oai([{role:'user',content:'Find the finished square footage in these construction documents. Return JSON: {"sqft":<number or 0>,"source":"where found","confidence":"high|medium|low"}. Only return sqft if clearly stated in the docs. Scope hint: '+scope+'\nDocs:\n'+(txt||'none')}], 150);
  }
  if (ep==='/api/takeoff') {
    var files=gfs('files'), scope=gf('scope'), pt=gf('project_type'), sq=gf('sqft'), tier=gf('tier'), st=gf('state');
    var txt='';
    for (var fi=0;fi<Math.min(files.length,3);fi++) txt+=await pdfText(files[fi]);
    return _oai([
      {role:'system',content:'Expert NY/NJ GC estimator. Return valid JSON only.'},
      {role:'user',content:'Detailed takeoff for a '+pt+', '+sq+' sq ft, '+tier+' tier, '+st+'. Scope: '+scope+'.'+(txt?'\nPlans: '+txt:'')+'\nReturn JSON: {materials:[{item,qty,unit,unitPrice,total}],labor:[{trade,hours,rate,total}],totals:{materials,labor,subtotal,tax,grand},summary:string}. Real 2025 NJ/NY pricing. 6-10 material items, 4-6 labor trades.'}
    ], 1400);
  }
  if (ep==='/api/schedule') {
    var b={}; try{b=JSON.parse((opts&&opts.body)||'{}');}catch(e){}
    return _oai([{role:'user',content:'Trade-sequenced schedule for '+(b.projectType||'remodel')+', '+(b.sqft||200)+' sq ft, '+(b.state||'NJ')+'. Return JSON: {phases:[{id,name,trade,duration,dependsOn:[],notes}]}. 6-10 phases, demo to punch list sequence. Duration in working days.'}], 700);
  }
  if (ep==='/api/beta-signup') return {ok:true,message:'Signed up!'};
  throw new Error('Unknown endpoint: '+ep);
}

let takeoffCtx = null;

let intakeExtracting = false;
let intakeExtracted = null;

function addPlanFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  const existing = wizard.planFiles || [];
  const toAdd = Array.from(fileList).filter(f => {
    if (f.size > 40 * 1024 * 1024) { showToast(`${f.name} too big (>40MB)`); return false; }
    return !existing.some(e => e.name === f.name && e.size === f.size);
  });
  wizard.planFiles = [...existing, ...toAdd].slice(0, 8);
  render();
}

function removePlanFile(idx) {
  wizard.planFiles = (wizard.planFiles || []).filter((_, i) => i !== Number(idx));
  render();
}

function mergeIntakeData(data) {
  const d = wizard.data;
  const fields = ['name', 'client', 'clientEmail', 'address', 'projectType', 'scopeNotes'];
  fields.forEach(k => {
    if (data[k] && (!d[k] || d[k] === '' || (k === 'projectType' && d.projectType === 'Kitchen remodel'))) {
      d[k] = data[k];
    }
  });
  if (data.state && STATES.some(s => s.code === data.state)) d.state = data.state;
  if (data.sqft && Number(data.sqft) > 0) d.sqft = Number(data.sqft);
}

async function runIntakeAutofill() {
  const files = wizard.planFiles || [];
  if (files.length === 0) { intakeExtractError = 'Add plans or docs first.'; render(); return; }

  intakeExtracting = true;
  intakeExtractError = null;
  measureState = { running: true, result: null, error: null };
  render();

  // Run intake + measure in parallel so the user gets the best of both
  const intakeFd = new FormData();
  files.forEach(f => intakeFd.append('files', f, f.name));

  const measureFd = new FormData();
  measureFd.append('scope_notes', wizard.data.scopeNotes || '');
  files.forEach(f => measureFd.append('files', f, f.name));

  const intakePromise = fetch(TAKEOFF_API + '/api/intake-extract', { method: 'POST', body: intakeFd })
    .then(r => r.json());
  const measurePromise = fetch(TAKEOFF_API + '/api/measure-sqft', { method: 'POST', body: measureFd })
    .then(r => r.json());

  try {
    const intake = await intakePromise;
    if (intake.error) throw new Error(intake.error);
    // Strip the weak SF from intake — we trust the measure endpoint instead
    const intakeClean = { ...intake };
    delete intakeClean.sqft;
    mergeIntakeData(intakeClean);
    intakeExtracted = intake;
  } catch (e) {
    if (e.isAiBlocked) { showAiBlockedBanner(); intakeExtracting = false; render(); return; }
    intakeExtractError = 'Auto-fill failed: ' + (e.message || e);
  }

  try {
    const measure = await measurePromise;
    if (measure.error) throw new Error(measure.error);
    measureState = { running: false, result: measure, error: null };
    if (measure.sqft && Number(measure.sqft) > 0) {
      wizard.data.sqft = Number(measure.sqft);
      wizard.sqftSource = `${measure.source || 'measured from plans'} (${measure.confidence || 'medium'} confidence)`;
    } else {
      wizard.sqftSource = 'plan unreadable — enter manually';
    }
  } catch (e) {
    if (e.isAiBlocked) { showAiBlockedBanner(); }
    measureState = { running: false, result: null, error: e.isAiBlocked ? null : 'Measurement failed: ' + (e.message || e) };
  }

  intakeExtracting = false;
  if (!intakeExtractError && measureState.result) showToast('Intake + square footage auto-filled');
  else if (!intakeExtractError) showToast('Intake auto-filled');
  render();
}

async function runFullTakeoff() {
  const files = wizard.planFiles || [];
  if (files.length === 0) { intakeExtractError = 'Add plans or docs first.'; render(); return; }

  // Step 1: autofill intake (fast)
  await runIntakeAutofill();
  if (intakeExtractError) return;

  // Step 2: run full takeoff using the same files + filled data
  takeoffRunning = true;
  render();

  const fd = new FormData();
  fd.append('scope', wizard.data.scopeNotes || '');
  fd.append('project_type', wizard.data.projectType);
  fd.append('sqft', String(wizard.data.sqft || 0));
  fd.append('tier', wizard.data.tier);
  fd.append('state', wizard.data.state);
  files.forEach(f => fd.append('files', f, f.name));

  try {
    const res = await fetch(TAKEOFF_API + '/api/takeoff', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    data.generatedAt = new Date().toISOString();
    wizard.takeoff = data;
    showToast('Takeoff ready');

    // Step 3: auto-seed a schedule in the background. Don't block the UI on failure.
    try {
      const sched = await fetchAiSchedule({
        projectType: wizard.data.projectType,
        sqft: wizard.data.sqft,
        tier: wizard.data.tier,
        state: wizard.data.state,
        scopeNotes: wizard.data.scopeNotes,
        takeoff: data,
      });
      wizard.schedule = sched;
      showToast('Schedule drafted: ' + sched.phases.length + ' phases');
    } catch (schedErr) {
      console.warn('Auto-schedule failed:', schedErr);
      // Not fatal — user can generate manually from the Schedule tab later.
    }
  } catch (e) {
    if (e.isAiBlocked) { showAiBlockedBanner(); takeoffRunning = false; render(); return; }
    intakeExtractError = 'Takeoff failed: ' + (e.message || e);
  }
  takeoffRunning = false;
  render();
}

// ---------- Measure Square Footage from plans ----------
let measureState = { running: false, result: null, error: null };

async function runMeasureSqft(files, scopeNotes) {
  if (!files || files.length === 0) { showToast('Upload at least one plan first'); return; }
  measureState = { running: true, result: null, error: null };
  render();
  const fd = new FormData();
  fd.append('scope_notes', scopeNotes || '');
  files.forEach(f => fd.append('files', f, f.name));
  try {
    const res = await fetch(TAKEOFF_API + '/api/measure-sqft', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    measureState = { running: false, result: data, error: null };
    if (data.sqft && Number(data.sqft) > 0) {
      wizard.data.sqft = Number(data.sqft);
      wizard.sqftSource = `${data.source || 'measured from plans'} (${data.confidence || 'medium'} confidence)`;
      showToast('Square footage measured: ' + Number(data.sqft).toLocaleString() + ' sq ft');
    } else {
      wizard.sqftSource = 'plan unreadable — enter manually';
      showToast('Could not read plan — enter SF manually');
    }
  } catch (e) {
    if (e.isAiBlocked) { showAiBlockedBanner(); measureState = { running: false, result: null, error: null }; }
    else { measureState = { running: false, result: null, error: e.message || String(e) }; }
  }
  render();
}

function bindTakeoffModal() {
  const fileInput = document.getElementById('to-files');
  const listEl = document.getElementById('to-files-list');
  if (fileInput) {
    fileInput.onchange = () => {
      takeoffFiles = Array.from(fileInput.files || []).slice(0, 8);
      listEl.innerHTML = takeoffFiles.length === 0 ? '' : takeoffFiles.map(f => `• ${f.name} (${Math.round(f.size/1024)} KB)`).join('<br>');
    };
  }
  const stateInput = document.getElementById('to-state');
  const stateBtns = document.querySelectorAll('[data-to-state]');
  stateBtns.forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      if (stateInput) stateInput.value = btn.dataset.toState;
      stateBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });
  const runBtn = document.getElementById('to-run');
  if (runBtn) runBtn.onclick = runTakeoff;
  const measureBtn = document.getElementById('to-measure');
  if (measureBtn) measureBtn.onclick = async () => {
    if (!takeoffFiles || takeoffFiles.length === 0) { showToast('Upload at least one plan first'); return; }
    const scopeNotes = (document.getElementById('to-scope')?.value || '').trim();
    measureBtn.disabled = true; measureBtn.textContent = 'Measuring…';
    await runMeasureSqft(takeoffFiles, scopeNotes);
    // Re-bind modal since render() rebuilt it
    setTimeout(bindTakeoffModal, 0);
  };
  // Apply-sqft buttons inside the modal result card
  document.querySelectorAll('[data-apply-sqft]').forEach(b => b.onclick = () => {
    const v = Number(b.dataset.applySqft);
    const input = document.getElementById('to-sqft');
    if (input) { input.value = v; showToast('Square footage set to ' + v.toLocaleString()); }
  });
}

async function runTakeoff() {
  if (takeoffRunning) return;
  const scope = (document.getElementById('to-scope')?.value || '').trim();
  const files = takeoffFiles;
  if (!scope && files.length === 0) {
    document.getElementById('to-error').style.display = 'block';
    document.getElementById('to-error').textContent = 'Type a scope or upload at least one plan / document.';
    return;
  }

  takeoffRunning = true;
  const btn = document.getElementById('to-run');
  const statusEl = document.getElementById('to-status');
  const errorEl = document.getElementById('to-error');
  errorEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.textContent = files.length > 0
    ? `Reading ${files.length} file(s) and building takeoff… (can take 20–60 seconds)`
    : 'Parsing scope and building takeoff…';
  if (btn) { btn.disabled = true; btn.textContent = 'Running…'; btn.style.opacity = '0.7'; }

  const fd = new FormData();
  fd.append('scope', scope);
  fd.append('project_type', document.getElementById('to-type').value);
  fd.append('sqft', String(document.getElementById('to-sqft').value || 0));
  fd.append('tier', document.getElementById('to-tier').value);
  fd.append('state', document.getElementById('to-state').value);
  files.forEach(f => fd.append('files', f, f.name));

  try {
    const res = await fetch(TAKEOFF_API + '/api/takeoff', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.error) {
      throw new Error(data.error || ('HTTP ' + res.status));
    }
    data.generatedAt = new Date().toISOString();

    if (takeoffCtx === 'wizard') {
      wizard.takeoff = data;
    } else if (takeoffCtx) {
      const p = state.projects.find(x => x.id === takeoffCtx);
      if (p) {
        p.takeoff = data;
        saveState();
      }
    }
    state.modal = null;
    showToast('Takeoff ready');
    render();
  } catch (e) {
    statusEl.style.display = 'none';
    if (e.isAiBlocked) { showAiBlockedBanner(); if (btn) { btn.disabled = false; btn.textContent = 'Run AI Takeoff'; btn.style.opacity = '1'; } return; }
    errorEl.style.display = 'block';
    errorEl.textContent = 'Takeoff failed: ' + (e.message || e) + '. Try again or reduce file sizes.';
    if (btn) { btn.disabled = false; btn.textContent = 'Run AI Takeoff'; btn.style.opacity = '1'; }
  }
  takeoffRunning = false;
}

// ========== SCHEDULE / GANTT ==========
const TRADE_COLORS = {
  'GC': '#6366f1',
  'Demo': '#94a3b8',
  'Framing': '#a16207',
  'Plumbing': '#0ea5e9',
  'Electrical': '#eab308',
  'HVAC': '#14b8a6',
  'Insulation': '#f97316',
  'Drywall': '#d4d4d8',
  'Tile': '#8b5cf6',
  'Cabinets': '#78350f',
  'Flooring': '#84cc16',
  'Paint': '#ec4899',
  'Trim': '#06b6d4',
  'Inspector': '#ef4444',
  'Finish': '#10b981',
  'Other': '#64748b',
};
function tradeColor(t) { return TRADE_COLORS[t] || TRADE_COLORS['Other']; }

function addWorkingDays(startISO, days) {
  if (!startISO) return null;
  const d = new Date(startISO + 'T12:00:00');
  let added = 0;
  if (days <= 0) return d.toISOString().slice(0,10);
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) added++;
  }
  return d.toISOString().slice(0,10);
}
function daysBetween(aISO, bISO) {
  const a = new Date(aISO + 'T12:00:00');
  const b = new Date(bISO + 'T12:00:00');
  return Math.round((b - a) / 86400000);
}
function todayISO() { return new Date().toISOString().slice(0,10); }

function computeSchedule(sched) {
  if (!sched || !sched.phases || !sched.phases.length) return { phases: [], startISO: null, endISO: null };
  const start = sched.startDate || todayISO();
  // Topological sort + compute start/end
  const byId = {}; sched.phases.forEach(p => byId[p.id] = { ...p });
  const visited = {}; const ordered = [];
  function visit(id) {
    if (visited[id]) return;
    visited[id] = true;
    const p = byId[id]; if (!p) return;
    (p.dependsOn || []).forEach(visit);
    ordered.push(p);
  }
  sched.phases.forEach(p => visit(p.id));
  ordered.forEach(p => {
    if (p.startOverride) {
      p.start = p.startOverride;
    } else {
      let earliest = start;
      (p.dependsOn || []).forEach(depId => {
        const dep = byId[depId];
        if (dep && dep.end) {
          const next = addWorkingDays(dep.end, 1);
          if (next > earliest) earliest = next;
        }
      });
      p.start = earliest;
    }
    p.end = addWorkingDays(p.start, Math.max(1, p.duration || 1) - 1);
  });
  // Restore original order in output but with computed dates
  const out = sched.phases.map(p => byId[p.id]);
  const endISO = out.reduce((max, p) => (!max || p.end > max) ? p.end : max, null);
  return { phases: out, startISO: start, endISO };
}

function renderTabSchedule(p) {
  const sched = p.schedule || { startDate: todayISO(), phases: [] };
  if (!sched.phases || !sched.phases.length) {
    return `
      <div class="card">
        <div class="empty" style="text-align: center; padding: 40px 20px;">
          <div style="font-size: 15px; font-weight: 600; margin-bottom: 6px;">No schedule yet</div>
          <p class="muted" style="max-width: 420px; margin: 0 auto 16px;">Let the AI draft a realistic phase-by-phase schedule based on this project's scope, size, and state. You can then drag phases, edit durations, and mark them done as work progresses.</p>
          <div class="row" style="justify-content: center; gap: 8px;">
            <button class="btn btn-primary btn-sm" data-gen-schedule="${p.id}">${ico('sparkle') || ''}Generate AI schedule</button>
            <button class="btn btn-secondary btn-sm" data-add-phase="${p.id}">${ico('plus')}Add phase manually</button>
          </div>
          <div class="row" style="justify-content: center; gap: 8px; margin-top: 12px;">
            <label class="muted" style="font-size: 12px;">Project start: <input type="date" class="input" style="padding: 4px 8px; font-size: 12px;" data-sched-start="${p.id}" value="${sched.startDate || todayISO()}" /></label>
          </div>
        </div>
      </div>
    `;
  }
  const computed = computeSchedule(sched);
  const startISO = computed.startISO;
  const endISO = computed.endISO;
  const totalDays = daysBetween(startISO, endISO) + 1;
  const dayWidthPx = Math.max(28, Math.min(56, Math.floor(900 / totalDays)));
  const today = todayISO();
  const todayOffset = (today >= startISO && today <= endISO) ? daysBetween(startISO, today) : -1;

  // Build day cells
  const dayCells = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(new Date(startISO + 'T12:00:00').getTime() + i * 86400000);
    const dow = d.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isMonthStart = d.getDate() === 1 || i === 0;
    const label = isMonthStart ? `${d.toLocaleDateString('en-US', { month: 'short' })} ${d.getDate()}` : d.getDate();
    dayCells.push({ iso: d.toISOString().slice(0,10), label, isWeekend, isMonthStart });
  }

  const headerCells = dayCells.map(c => `<div class="sched-timeline-head-cell ${c.isWeekend ? 'weekend' : ''} ${c.isMonthStart ? 'month-start' : ''}" style="width: ${dayWidthPx}px;">${c.label}</div>`).join('');
  const timelineWidth = totalDays * dayWidthPx;

  const phaseRows = computed.phases.map(ph => {
    const offsetDays = daysBetween(startISO, ph.start);
    const durationDays = daysBetween(ph.start, ph.end) + 1;
    const left = offsetDays * dayWidthPx;
    const width = durationDays * dayWidthPx - 4;
    const color = tradeColor(ph.trade);
    const doneClass = ph.done ? 'done' : (ph.start <= today && today <= ph.end ? 'in-progress' : '');
    const bgCells = dayCells.map(c => `<div style="width: ${dayWidthPx}px; ${c.isWeekend ? 'background: var(--surface-3, rgba(0,0,0,0.03));' : ''} border-left: 1px solid var(--border); height: 100%;"></div>`).join('');
    return `
      <div class="sched-row">
        <div class="sched-row-label ${ph.done ? 'done' : ''}" data-edit-phase="${p.id}:${ph.id}">
          <span class="sched-trade-dot" style="background: ${color};" title="${ph.trade}"></span>
          <div style="flex: 1; min-width: 0;">
            <div class="sched-row-name" style="font-weight: 500;">${ph.name}</div>
            <div class="muted" style="font-size: 11px; margin-top: 1px;">${ph.trade} · ${ph.duration}d · ${fmtShortDate(ph.start)}</div>
          </div>
        </div>
        <div class="sched-row-timeline" style="grid-template-columns: repeat(${totalDays}, ${dayWidthPx}px); width: ${timelineWidth}px;">
          ${bgCells}
          <div class="sched-bar ${doneClass}" style="left: ${left}px; width: ${width}px; background: ${color};" data-bar-phase="${p.id}:${ph.id}" title="${ph.name} — ${ph.start} to ${ph.end}${ph.notes ? '\n' + ph.notes : ''}">
            ${ph.done ? '✓ ' : ''}${ph.name}
          </div>
        </div>
      </div>
    `;
  }).join('');

  const todayLine = todayOffset >= 0 ? `<div class="sched-today-line" style="left: ${todayOffset * dayWidthPx + dayWidthPx/2}px;"></div>` : '';

  // Trade legend
  const uniqueTrades = [...new Set(computed.phases.map(ph => ph.trade))];
  const legend = uniqueTrades.map(t => `<span class="sched-legend-item"><span class="sched-legend-swatch" style="background: ${tradeColor(t)};"></span>${t}</span>`).join('');

  return `
    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="row" style="justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;">
        <div>
          <h3 style="margin: 0; font-size: 15px;">Schedule</h3>
          <div class="muted" style="font-size: 12px; margin-top: 2px;">
            ${computed.phases.length} phases · ${totalDays} calendar days · ${fmtShortDate(startISO)} → ${fmtShortDate(endISO)}
          </div>
        </div>
        <div class="row" style="gap: 8px; align-items: center;">
          <label class="muted" style="font-size: 12px; display: flex; align-items: center; gap: 6px;">Start: <input type="date" class="input" style="padding: 4px 8px; font-size: 12px; width: 140px;" data-sched-start="${p.id}" value="${startISO}" /></label>
          <button class="btn btn-ghost btn-sm" data-add-phase="${p.id}" type="button">${ico('plus')}Phase</button>
          <button class="btn btn-ghost btn-sm" data-gen-schedule="${p.id}" type="button" title="Regenerate from AI">AI</button>
        </div>
      </div>
      <div class="sched-wrap">
        <div class="sched-grid" style="grid-template-columns: 260px ${timelineWidth}px; position: relative;">
          <div class="sched-header">
            <div>Phase</div>
            <div class="sched-timeline-head" style="width: ${timelineWidth}px;">
              <div class="sched-timeline-head-inner" style="grid-template-columns: repeat(${totalDays}, ${dayWidthPx}px);">${headerCells}</div>
            </div>
          </div>
          ${phaseRows}
          ${todayLine ? `<div style="grid-column: 2; grid-row: 2 / span ${computed.phases.length + 1}; position: relative; pointer-events: none;">${todayLine}</div>` : ''}
        </div>
      </div>
      <div class="sched-legend">${legend}</div>
    </div>
  `;
}

function fmtShortDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function renderTabProgress(p) {
